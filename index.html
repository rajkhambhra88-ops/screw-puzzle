<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Screw Puzzle Game - Infinite Levels</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    background-color: #e9dbc5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-app {
    width: 100%;
    max-width: 440px;
    height: 100vh;
    max-height: 920px;
    background: #eadecb;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    z-index: 10;
  }
  .pause-btn {
    font-size: 26px;
    font-weight: 900;
    color: #4b4b4b;
    cursor: pointer;
  }
  .level-title {
    font-size: 22px;
    font-weight: 900;
    color: #45403c;
    letter-spacing: 0.5px;
  }
  .top-right-icons {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .cart-icon {
    font-size: 26px;
    cursor: pointer;
  }
  .star-badge {
    position: relative;
    width: 44px;
    height: 44px;
    background: #8b888d;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
  }
  .star-badge span {
    margin-top: 4px;
  }

  /* Target Boxes Row */
  .boxes-container {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 6px 12px;
    z-index: 10;
  }
  .box-card {
    width: 78px;
    height: 78px;
    border-radius: 18px;
    border: 4px solid #333;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .box-orange { background: #ff9d42; border-color: #d86c12; }
  .box-yellow { background: #ffd43f; border-color: #d19a00; }
  .box-blue   { background: #56baf8; border-color: #1783c5; }
  .box-brown  { background: #a46d49; border-color: #64391c; }

  .box-inner {
    width: 60px;
    height: 60px;
    background: #e7e2d9;
    border-radius: 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    padding: 4px;
    gap: 4px;
  }
  .box-hole {
    width: 17px;
    height: 17px;
    background: #8e95a0;
    border-radius: 50%;
    box-shadow: inset 1px 2px 3px rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .box-hole.filled {
    box-shadow: none;
  }

  .ad-box {
    background: #f7ca45;
    border: 4px solid #cb961a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .ad-box .plus {
    font-size: 34px;
    font-weight: 900;
    color: #6d4b00;
    line-height: 26px;
  }
  .ad-box .ad-tag {
    position: absolute;
    bottom: 4px;
    right: 5px;
    background: #73c82d;
    color: #fff;
    font-size: 9px;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 4px;
    border: 1px solid #488f12;
  }

  /* Buffer Holes Row */
  .buffer-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 10px 0 4px;
    z-index: 10;
  }
  .buffer-hole {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #8d98a7;
    box-shadow: inset 2px 2px 4px rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Play Board Area */
  .playfield {
    flex: 1;
    position: relative;
    margin: 8px 12px;
    overflow: hidden;
  }
  .leaf {
    position: absolute;
    width: 125px;
    height: 52px;
    border-radius: 65px 0px 65px 0px;
    border: 4px solid #ffffff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.18);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 10px;
    transform-origin: center center;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.4s;
  }
  .leaf-green  { background: #5ecba1; }
  .leaf-blue   { background: #62bdf4; }
  .leaf-yellow { background: #f3ca65; }
  .leaf-purple { background: #bda3e6; }

  /* Screws Styling */
  .screw {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.35);
    position: relative;
    transition: transform 0.1s ease;
  }
  .screw:active {
    transform: scale(0.9);
  }
  .screw::before {
    content: '+';
    font-size: 20px;
    font-weight: 900;
    color: rgba(0,0,0,0.4);
    line-height: 1;
    margin-top: -2px;
  }

  .screw-orange { background: radial-gradient(circle at 35% 35%, #ff952c, #d85c00); }
  .screw-yellow { background: radial-gradient(circle at 35% 35%, #fedc3c, #cf9700); }
  .screw-blue   { background: radial-gradient(circle at 35% 35%, #4bb3f6, #0e72b4); }
  .screw-brown  { background: radial-gradient(circle at 35% 35%, #9b613c, #573016); }

  .screw-mini {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.3);
  }

  /* Bottom Boosters */
  .bottom-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 16px 20px;
    margin-bottom: 30px;
    z-index: 10;
  }

  .booster-btn {
    width: 90px;
    height: 58px;
    background: #f7ca45;
    border: 3px solid #cb961a;
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 4px 0 #ab7905;
    cursor: pointer;
  }
  .booster-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #ab7905;
  }
  .booster-badge {
    position: absolute;
    top: -8px;
    right: -6px;
    background: #ffffff;
    border: 2px solid #555;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 900;
    padding: 0px 5px;
    color: #222;
  }

  /* Overlays */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.65);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-card {
    background: #fff;
    padding: 24px 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 82%;
  }
  .modal-title {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 10px;
    color: #333;
  }
  .modal-btn {
    margin-top: 15px;
    background: #5ecba1;
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-size: 18px;
    font-weight: 800;
    border-radius: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-app">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="pause-btn" onclick="togglePause()">❚❚</div>
    <div class="level-title" id="level-display">LEVEL 1</div>
    <div class="top-right-icons">
      <div class="cart-icon" onclick="resetBoosterCounts()">🛒</div>
      <div class="star-badge"><span id="progress-text">0%</span></div>
    </div>
  </div>

  <!-- Target Boxes -->
  <div class="boxes-container" id="boxes-row"></div>

  <!-- 5 Buffer Holes -->
  <div class="buffer-row" id="buffer-holes"></div>

  <!-- Playfield -->
  <div class="playfield" id="playfield"></div>

  <!-- Boosters -->
  <div class="bottom-bar">
    <div class="booster-btn" onclick="useBooster('drill')">
      <span style="font-size:28px;">🪛</span>
      <div class="booster-badge" id="drill-count">2</div>
    </div>
    <div class="booster-btn" onclick="useBooster('hammer')">
      <span style="font-size:28px;">🔨</span>
      <div class="booster-badge" id="hammer-count">1</div>
    </div>
    <div class="booster-btn" onclick="useBooster('cleaner')">
      <span style="font-size:28px;">🧹</span>
      <div class="booster-badge" id="cleaner-count">1</div>
    </div>
  </div>

  <!-- Win Modal -->
  <div class="overlay" id="win-modal">
    <div class="modal-card">
      <div class="modal-title">शानदार जीत! 🏆</div>
      <p id="win-subtext">लेवल पूरा हुआ!</p>
      <button class="modal-btn" onclick="nextLevel()">अगला लेवल ➔</button>
    </div>
  </div>

  <!-- Fail Modal -->
  <div class="overlay" id="fail-modal">
    <div class="modal-card">
      <div class="modal-title" style="color:#d9534f;">गेम ओवर! ⚠️</div>
      <p>सारे बफ़र स्लॉट भर गए हैं।</p>
      <button class="modal-btn" style="background:#f0ad4e;" onclick="retryLevel()">पुनः प्रयास करें</button>
    </div>
  </div>
</div>

<script>
  // Web Audio Synthesizer
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'click') {
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'match') {
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.09);
      osc.frequency.setValueAtTime(783, now + 0.18);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'fail') {
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(150, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    }
  }

  // Master State
  let currentLevel = parseInt(localStorage.getItem('screw_game_level') || '1');
  const ALL_COLORS = ['orange', 'yellow', 'blue', 'brown'];
  const LEAF_COLORS = ['leaf-green', 'leaf-blue', 'leaf-yellow', 'leaf-purple'];

  let boxSlots = [];
  let buffer = [null, null, null, null, null];
  let leaves = [];
  let totalScrews = 0;
  let removedScrews = 0;
  let boosters = { drill: 2, hammer: 1, cleaner: 1 };

  // Generate Level with Progressive Difficulty
  function generateLevel(lvl) {
    let leafCount, activeColorList;

    if (lvl === 1) {
      leafCount = 2;
      activeColorList = ['orange', 'yellow'];
    } else if (lvl === 2) {
      leafCount = 3;
      activeColorList = ['orange', 'yellow'];
    } else if (lvl <= 5) {
      leafCount = 4 + (lvl - 3);
      activeColorList = ['orange', 'yellow', 'blue'];
    } else if (lvl <= 10) {
      leafCount = 7 + Math.floor((lvl - 6) * 0.8);
      activeColorList = ['orange', 'yellow', 'blue', 'brown'];
    } else {
      // Endless hard levels like level 132
      leafCount = Math.min(13, 8 + Math.floor(lvl / 15));
      activeColorList = ALL_COLORS;
    }

    // Boxes Setup
    boxSlots = [
      { type: 'box', color: activeColorList[0], count: 0 },
      { type: 'box', color: activeColorList[1] || activeColorList[0], count: 0 },
      { type: 'ad', unlocked: false },
      { type: 'ad', unlocked: false }
    ];

    buffer = [null, null, null, null, null];

    // Generate Leaves Coordinates & Screws
    leaves = [];
    let screwIdCounter = 1;

    for (let i = 0; i < leafCount; i++) {
      // Distribute leaves across canvas
      let topPos = 70 + (i * 24) + (Math.sin(i * 1.5) * 20);
      let leftPos = 40 + ((i % 3) * 65) + (Math.cos(i) * 25);
      let rotation = -40 + ((i * 35) % 85);
      let leafColor = LEAF_COLORS[i % LEAF_COLORS.length];

      let screwsOnThisLeaf = (lvl === 1) ? 2 : (i % 2 === 0 ? 2 : 3);
      let leafScrews = [];

      for (let s = 0; s < screwsOnThisLeaf; s++) {
        let scColor = activeColorList[(i + s) % activeColorList.length];
        leafScrews.push({
          id: 's_' + (screwIdCounter++),
          color: scColor
        });
      }

      leaves.push({
        id: 'leaf_' + (i + 1),
        top: Math.round(topPos),
        left: Math.round(leftPos),
        rot: rotation,
        color: leafColor,
        screws: leafScrews
      });
    }

    totalScrews = 0;
    leaves.forEach(l => totalScrews += l.screws.length);
    removedScrews = 0;

    document.getElementById('level-display').innerText = `LEVEL ${lvl}`;
    updateProgress();
    renderBoxes();
    renderBuffer();
    renderPlayfield();
  }

  function renderBoxes() {
    const container = document.getElementById('boxes-row');
    container.innerHTML = '';
    boxSlots.forEach((slot, index) => {
      const box = document.createElement('div');
      box.className = 'box-card';
      if (slot.type === 'box') {
        box.classList.add('box-' + slot.color);
        const inner = document.createElement('div');
        inner.className = 'box-inner';
        for (let i = 0; i < 3; i++) {
          const hole = document.createElement('div');
          hole.className = 'box-hole';
          if (i < slot.count) {
            hole.classList.add('filled');
            const sm = document.createElement('div');
            sm.className = `screw screw-mini screw-${slot.color}`;
            hole.appendChild(sm);
          }
          inner.appendChild(hole);
        }
        box.appendChild(inner);
      } else {
        box.classList.add('ad-box');
        box.innerHTML = `<span class="plus">+</span><span class="ad-tag">AD</span>`;
        box.onclick = () => unlockAdSlot(index);
      }
      container.appendChild(box);
    });
  }

  function renderBuffer() {
    const row = document.getElementById('buffer-holes');
    row.innerHTML = '';
    buffer.forEach((color) => {
      const hole = document.createElement('div');
      hole.className = 'buffer-hole';
      if (color) {
        const sc = document.createElement('div');
        sc.className = `screw screw-mini screw-${color}`;
        hole.appendChild(sc);
      }
      row.appendChild(hole);
    });
  }

  function renderPlayfield() {
    const pf = document.getElementById('playfield');
    pf.innerHTML = '';

    leaves.forEach((l, leafIndex) => {
      const leafEl = document.createElement('div');
      leafEl.className = `leaf ${l.color}`;
      leafEl.id = l.id;
      leafEl.style.top = l.top + 'px';
      leafEl.style.left = l.left + 'px';
      leafEl.style.transform = `rotate(${l.rot}deg)`;
      leafEl.style.zIndex = leafIndex + 1;

      l.screws.forEach((s) => {
        const sc = document.createElement('div');
        sc.className = `screw screw-${s.color}`;
        sc.onclick = (e) => {
          e.stopPropagation();
          handleScrewClick(l.id, s.id, s.color);
        };
        leafEl.appendChild(sc);
      });

      pf.appendChild(leafEl);
    });
  }

  function handleScrewClick(leafId, screwId, color) {
    playSound('click');

    // 1. Check if matching color box has free slot
    let targetBox = boxSlots.find(b => b.type === 'box' && b.color === color && b.count < 3);

    if (targetBox) {
      targetBox.count++;
      removeScrewFromBoard(leafId, screwId);
      if (targetBox.count === 3) {
        playSound('match');
        setTimeout(() => recycleBox(targetBox), 320);
      }
    } else {
      // 2. Put into empty buffer hole
      let emptyIdx = buffer.indexOf(null);
      if (emptyIdx !== -1) {
        buffer[emptyIdx] = color;
        removeScrewFromBoard(leafId, screwId);
      } else {
        // Buffer is completely full -> Game Over
        playSound('fail');
        document.getElementById('fail-modal').style.display = 'flex';
        return;
      }
    }

    renderBoxes();
    renderBuffer();
    checkBufferToBoxHop();
    updateProgress();
  }

  function removeScrewFromBoard(leafId, screwId) {
    const leaf = leaves.find(l => l.id === leafId);
    if (!leaf) return;
    leaf.screws = leaf.screws.filter(s => s.id !== screwId);
    removedScrews++;

    // If no screws left on this leaf, drop it smoothly
    if (leaf.screws.length === 0) {
      const leafElem = document.getElementById(leaf.id);
      if (leafElem) {
        leafElem.style.transform += ' translateY(420px) rotate(40deg)';
        leafElem.style.opacity = '0';
        setTimeout(() => {
          leaves = leaves.filter(l => l.id !== leafId);
          renderPlayfield();
        }, 450);
      }
    } else {
      renderPlayfield();
    }
  }

  function recycleBox(box) {
    box.count = 0;
    const remainingColors = [];
    leaves.forEach(l => l.screws.forEach(s => remainingColors.push(s.color)));
    buffer.forEach(c => { if(c) remainingColors.push(c); });

    if (remainingColors.length > 0) {
      box.color = remainingColors[Math.floor(Math.random() * remainingColors.length)];
    } else {
      box.color = ALL_COLORS[Math.floor(Math.random() * ALL_COLORS.length)];
    }

    renderBoxes();
    checkBufferToBoxHop();
  }

  function checkBufferToBoxHop() {
    let moved = false;
    buffer.forEach((color, idx) => {
      if (color) {
        let matchingBox = boxSlots.find(b => b.type === 'box' && b.color === color && b.count < 3);
        if (matchingBox) {
          matchingBox.count++;
          buffer[idx] = null;
          moved = true;
          if (matchingBox.count === 3) {
            playSound('match');
            setTimeout(() => recycleBox(matchingBox), 320);
          }
        }
      }
    });

    if (moved) {
      renderBoxes();
      renderBuffer();
    }
  }

  function unlockAdSlot(index) {
    playSound('click');
    const activeColors = boxSlots.filter(b => b.type === 'box').map(b => b.color);
    const candidate = ALL_COLORS.find(c => !activeColors.includes(c)) || 'orange';
    boxSlots[index] = { type: 'box', color: candidate, count: 0 };
    renderBoxes();
    checkBufferToBoxHop();
  }

  function updateProgress() {
    let percent = totalScrews > 0 ? Math.min(100, Math.floor((removedScrews / totalScrews) * 100)) : 100;
    document.getElementById('progress-text').innerText = percent + '%';

    if (removedScrews >= totalScrews && totalScrews > 0) {
      playSound('match');
      setTimeout(() => {
        document.getElementById('win-subtext').innerText = `लेवल ${currentLevel} पूरा हुआ!`;
        document.getElementById('win-modal').style.display = 'flex';
      }, 550);
    }
  }

  // Next Level Progression
  function nextLevel() {
    document.getElementById('win-modal').style.display = 'none';
    currentLevel++;
    localStorage.setItem('screw_game_level', currentLevel);
    generateLevel(currentLevel);
  }

  function retryLevel() {
    document.getElementById('fail-modal').style.display = 'none';
    generateLevel(currentLevel);
  }

  // Boosters
  function useBooster(type) {
    if (boosters[type] <= 0) return;

    if (type === 'drill') {
      for (let l of leaves) {
        if (l.screws.length > 0) {
          const s = l.screws[0];
          boosters.drill--;
          document.getElementById('drill-count').innerText = boosters.drill;
          handleScrewClick(l.id, s.id, s.color);
          return;
        }
      }
    } else if (type === 'hammer') {
      if (leaves.length > 0) {
        const topLeaf = leaves[leaves.length - 1];
        boosters.hammer--;
        document.getElementById('hammer-count').innerText = boosters.hammer;
        removedScrews += topLeaf.screws.length;
        leaves.pop();
        playSound('click');
        renderPlayfield();
        updateProgress();
      }
    } else if (type === 'cleaner') {
      buffer = [null, null, null, null, null];
      boosters.cleaner--;
      document.getElementById('cleaner-count').innerText = boosters.cleaner;
      playSound('click');
      renderBuffer();
    }
  }

  function resetBoosterCounts() {
    boosters = { drill: 2, hammer: 1, cleaner: 1 };
    document.getElementById('drill-count').innerText = boosters.drill;
    document.getElementById('hammer-count').innerText = boosters.hammer;
    document.getElementById('cleaner-count').innerText = boosters.cleaner;
  }

  function togglePause() {
    alert("गेम पॉज़ है। जारी रखने के लिए OK दबाएं।");
  }

  // First Run
  generateLevel(currentLevel);
</script>
</body>
</html>
