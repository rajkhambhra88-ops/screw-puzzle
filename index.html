<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#18243b">
<title>Screw Puzzle 3D Deluxe</title>
<style>
:root{--ink:#17243b;--gold:#ffd36a;--cream:#f5ead7}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{min-height:100dvh;background:radial-gradient(circle at 50% 12%,#435879,#111a2d 72%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;color:#263044;overflow:hidden}
button{font:inherit;cursor:pointer;border:0}
#app{width:min(100%,480px);height:100dvh;min-height:560px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#f8eddb,#ddc7a6);box-shadow:0 0 45px #0008}
.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:9px 15px;background:linear-gradient(180deg,#fff8e9,#ead8bd);box-shadow:0 3px 9px #65452630;z-index:5}
.iconbtn{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#fff,#d7c4a9);box-shadow:inset 0 2px 3px #fff,0 3px 6px #674c3035;color:#38445a;font-size:19px;font-weight:900}
.level{text-align:center;font-weight:1000;font-size:19px;letter-spacing:1px;color:#34415a}
.sublevel{font-size:10px;color:#8b765a;letter-spacing:2px}
.coins{background:linear-gradient(135deg,#fff0b4,#e9ae37);padding:8px 11px;border-radius:13px;font-weight:900;box-shadow:0 3px 0 #a87520;color:#68440c;font-size:13px}
.progress-wrap{height:7px;background:#b9a78d;z-index:4}
#progress{height:100%;width:0;background:linear-gradient(90deg,#4fc9a0,#a5e36e);transition:width .3s}
.status{display:flex;justify-content:space-between;padding:8px 17px 3px;font-size:11px;font-weight:800;color:#806c52;letter-spacing:.7px}
.boxes{display:flex;justify-content:center;gap:10px;padding:5px 10px 9px;z-index:3}
.box{width:clamp(62px,17vw,76px);height:clamp(62px,17vw,76px);border-radius:19px;display:grid;place-items:center;position:relative;border:3px solid #ffffffa8;box-shadow:inset 0 4px 5px #fff9,inset 0 -7px 8px #0003,0 7px 10px #45301e45;transform:translateY(0);transition:transform .2s}
.box:active{transform:translateY(3px)}
.box-core{width:75%;height:75%;border-radius:13px;background:linear-gradient(145deg,#e9e4d4,#c8bda7);box-shadow:inset 0 3px 6px #0004;display:flex;align-items:center;justify-content:center;gap:3px}
.mini-hole{width:23%;aspect-ratio:1;border-radius:50%;background:#526073;box-shadow:inset 2px 3px 5px #111}
.box-count{position:absolute;right:-5px;top:-7px;border-radius:9px;background:#fff;color:#263044;font-size:11px;font-weight:1000;padding:2px 6px;box-shadow:0 2px 5px #0004}
.box.ad{background:linear-gradient(145deg,#ffe56d,#e9a51b);color:#624300;font-size:29px;font-weight:1000}
.box.ad small{position:absolute;bottom:3px;right:6px;font-size:9px;background:#4c9e43;color:#fff;border-radius:5px;padding:1px 4px}
.buffer-label{text-align:center;font-size:10px;font-weight:900;letter-spacing:2px;color:#8c7555;margin:1px 0 5px}
.buffer{display:flex;justify-content:center;gap:10px;padding:0 10px 8px}
.slot{width:31px;height:31px;border-radius:50%;background:linear-gradient(145deg,#758398,#39465b);box-shadow:inset 3px 4px 7px #101827,0 2px 2px #fff8;display:grid;place-items:center}
.playfield{flex:1;position:relative;margin:2px 10px 7px;border-radius:25px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#f6e9d4 0,#e6d3b7 66%,#d0b995 100%);box-shadow:inset 0 5px 16px #765a3525,inset 0 -3px 10px #fff8}
.playfield:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#9c80531c 1px,transparent 1px);background-size:17px 17px;pointer-events:none}
.plate{position:absolute;width:clamp(126px,37vw,166px);height:58px;border:4px solid #fff;border-radius:23px 10px 23px 10px;display:flex;align-items:center;justify-content:space-evenly;padding:0 10px;box-shadow:inset 0 4px 6px #fff9,inset 0 -6px 7px #0003,0 11px 0 #0002,0 15px 17px #47321e42;transform-style:preserve-3d;transition:transform .42s ease,opacity .35s;z-index:1}
.plate.green{background:linear-gradient(145deg,#8af0c7,#36ae87);border-color:#f4fff9}
.plate.blue{background:linear-gradient(145deg,#91ddff,#328bc9)}
.plate.yellow{background:linear-gradient(145deg,#fff09b,#dca52c)}
.plate.purple{background:linear-gradient(145deg,#dfcaff,#9273d0)}
.plate.orange{background:linear-gradient(145deg,#ffc17e,#dc762c)}
.plate.hanging{animation:sway 2.3s ease-in-out infinite alternate;transform-origin:var(--pivot,50% 50%)}
@keyframes sway{from{rotate:-7deg}to{rotate:7deg}}
.plate.falling{transform:translateY(430px) rotate(65deg)!important;opacity:0}
.socket{width:33px;height:33px;border-radius:50%;background:radial-gradient(circle,#17130f 42%,#59483b 70%,#8b7660 100%);display:grid;place-items:center;flex:none;box-shadow:inset 2px 3px 5px #0009,0 1px 1px #fff8}
.screw{width:27px;height:27px;border-radius:50%;position:relative;border:2px solid #684c2d;box-shadow:inset 0 3px 4px #fff9,inset 0 -4px 5px #0005,0 4px 6px #0006;display:grid;place-items:center;z-index:2}
.screw:before,.screw:after{content:"";position:absolute;background:#493426;border-radius:2px;box-shadow:0 1px 1px #fff8}
.screw:before{width:14px;height:4px}.screw:after{width:4px;height:14px}
.orange{--s:#ff8d32}.yellow{--s:#f4c52e}.blue{--s:#36a9e8}.brown{--s:#95603b}
.screw.orange{background:radial-gradient(circle at 32% 27%,#ffe0ad,#ff8d32 58%,#a9480c)}
.screw.yellow{background:radial-gradient(circle at 32% 27%,#fffbd0,#f4c52e 58%,#9b7000)}
.screw.blue{background:radial-gradient(circle at 32% 27%,#d4f5ff,#36a9e8 58%,#07558b)}
.screw.brown{background:radial-gradient(circle at 32% 27%,#f0c49c,#95603b 58%,#4b2916)}
.screw:active{transform:scale(.9)}
.screw.blocked{filter:brightness(.58)}
.boosters{display:flex;justify-content:space-around;padding:9px 13px 15px;background:linear-gradient(180deg,#e5d2b6,#d6bd9b);z-index:3}
.boost{width:29%;height:57px;border-radius:17px;background:linear-gradient(180deg,#fff0a2,#e7ad27);border:2px solid #c38a16;box-shadow:inset 0 2px 2px #fff,0 5px 0 #986b17,0 7px 9px #0003;display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;position:relative}
.boost:active{transform:translateY(3px);box-shadow:inset 0 2px 2px #fff,0 2px 0 #986b17}
.boost b{font-size:12px;background:#fff;border-radius:8px;padding:2px 6px;color:#263044}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#26344d;color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:800;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;box-shadow:0 5px 18px #0004}
.toast.show{opacity:1}
.overlay{position:absolute;inset:0;background:#101827b9;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:20;padding:22px}
.dialog{width:min(340px,100%);background:linear-gradient(145deg,#fff9ed,#e9d7bb);border:3px solid #fff;border-radius:26px;padding:25px 20px;text-align:center;box-shadow:0 20px 50px #0007}
.dialog h2{font-size:25px;color:#33415b;margin-bottom:9px}.dialog p{font-size:14px;color:#79684e;line-height:1.5}
.action{margin-top:17px;padding:12px 22px;border-radius:14px;background:linear-gradient(135deg,#55d5a7,#239b75);color:#fff;font-weight:900;box-shadow:0 5px 0 #176c50;width:100%}
.secondary{background:linear-gradient(135deg,#8194b1,#53647f);box-shadow:0 5px 0 #34435b}
@media(max-height:680px){.top{height:57px}.boxes{padding:2px 8px 5px}.box{width:59px;height:59px}.buffer{padding-bottom:4px}.plate{height:52px}.boosters{padding:7px 12px 10px}.boost{height:49px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="iconbtn" id="pauseBtn" aria-label="Pause">Ⅱ</button>
    <div class="level"><div id="levelText">LEVEL 1</div><div class="sublevel">SCREW PUZZLE 3D</div></div>
    <div class="coins">🪙 <span id="coinText">100</span></div>
  </header>
  <div class="progress-wrap"><div id="progress"></div></div>
  <div class="status"><span>🎯 प्लेटों से स्क्रू निकालें</span><span id="percent">0% पूरा</span></div>
  <section class="boxes" id="boxes"></section>
  <div class="buffer-label">BUFFER SLOTS</div>
  <section class="buffer" id="buffer"></section>
  <main class="playfield" id="field" aria-label="Game board"></main>
  <footer class="boosters">
    <button class="boost" data-boost="drill" aria-label="Drill"><span>🪛</span><b id="drillCount">2</b></button>
    <button class="boost" data-boost="hammer" aria-label="Hammer"><span>🔨</span><b id="hammerCount">1</b></button>
    <button class="boost" data-boost="cleaner" aria-label="Cleaner"><span>🧹</span><b id="cleanerCount">1</b></button>
  </footer>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle">गेम रुका हुआ है</h2><p id="dialogText">जारी रखने के लिए नीचे दबाएँ।</p><button class="action" id="mainAction">जारी रखें</button><button class="action secondary" id="secondAction" style="display:none">फिर से शुरू करें</button></div></div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const COLORS=['orange','yellow','blue','brown'];
const PLATE_COLORS=['green','blue','yellow','purple','orange'];
const state={level:Math.max(1,Number(localStorage.getItem('sp3_level'))||1),coins:Math.max(0,Number(localStorage.getItem('sp3_coins'))||100),boxes:[],buffer:Array(5).fill(null),plates:[],total:0,removed:0,boost:{drill:2,hammer:1,cleaner:1},paused:false,ended:false,won:false,toastTimer:null};
let audio;
function sound(kind='tap'){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.connect(g);g.connect(audio.destination);o.type=kind==='bad'?'sawtooth':'sine';o.frequency.setValueAtTime(kind==='win'?520:kind==='bad'?150:420,t);o.frequency.exponentialRampToValueAtTime(kind==='win'?850:kind==='bad'?90:650,t+.12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.17)}catch(e){}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),1500)}
function save(){localStorage.setItem('sp3_level',state.level);localStorage.setItem('sp3_coins',state.coins)}
function levelConfig(){return {count:Math.min(12,2+Math.floor((state.level-1)*.8)),colors:state.level<3?2:state.level<6?3:4}}
function newLevel(){const cfg=levelConfig();state.boxes=[{color:'orange',count:0},{color:'yellow',count:0},{ad:true},{ad:true}];if(cfg.colors>=3)state.boxes[1].color='blue';state.buffer=Array(5).fill(null);state.plates=[];state.removed=0;state.ended=false;state.won=false;state.paused=false;state.boost={drill:2,hammer:1,cleaner:1};['drill','hammer','cleaner'].forEach(k=>$(k+'Count').textContent=state.boost[k]);
let id=0;for(let i=0;i<cfg.count;i++){let n=state.level===1?2:(i%2?3:2);let slots=[];for(let j=0;j<n;j++)slots.push({id:'s'+(++id),color:COLORS[(i+j)%cfg.colors]});state.plates.push({id:'p'+i,slots,color:PLATE_COLORS[i%PLATE_COLORS.length],x:8+(i%2)*43+(Math.floor(i/2)%2)*8,y:7+Math.floor(i/2)*17,rot:(i%3-1)*8,hanging:false})}
state.total=id;$('levelText').textContent='LEVEL '+state.level;hideDialog();render();updateProgress()}
function render(){renderBoxes();renderBuffer();renderField();updateProgress();$('coinText').textContent=state.coins}
function renderBoxes(){const root=$('boxes');root.innerHTML='';state.boxes.forEach((b,i)=>{const el=document.createElement('button');el.className='box'+(b.ad?' ad':'');if(b.ad){el.innerHTML='+<small>EXTRA</small>';el.onclick=()=>unlockExtra(i)}else{el.style.background=boxGradient(b.color);el.innerHTML='<div class="box-core"><i class="mini-hole"></i><i class="mini-hole"></i><i class="mini-hole"></i></div><span class="box-count">'+b.count+'/3</span>'}root.appendChild(el)})}
function boxGradient(c){return ({orange:'linear-gradient(145deg,#ffb15e,#d9650d)',yellow:'linear-gradient(145deg,#ffea69,#d69b08)',blue:'linear-gradient(145deg,#7bd5ff,#1478bd)',brown:'linear-gradient(145deg,#c18b62,#70401e)'})[c]}
function renderBuffer(){$('buffer').innerHTML='';state.buffer.forEach(c=>{const s=document.createElement('div');s.className='slot';if(c){const screw=document.createElement('i');screw.className='screw '+c;screw.style.width='22px';screw.style.height='22px';s.appendChild(screw)}$('buffer').appendChild(s)})}
function renderField(){const root=$('field');root.innerHTML='';const sorted=[...state.plates];sorted.forEach((p,index)=>{const el=document.createElement('div');el.className='plate '+p.color+(p.hanging?' hanging':'');el.id=p.id;el.style.left=p.x+'%';el.style.top=p.y+'%';el.style.transform=`rotate(${p.rot}deg)`;el.style.zIndex=index+1;el.style.setProperty('--pivot',p.pivot||'50% 50%');p.slots.forEach((s,j)=>{const socket=document.createElement('div');socket.className='socket';if(s.color){const sc=document.createElement('button');sc.className='screw '+s.color;sc.setAttribute('aria-label','स्क्रू निकालें');sc.onclick=()=>takeScrew(p.id,s.id);socket.appendChild(sc)}el.appendChild(socket)});root.appendChild(el)})}
function findScrew(p,s){return state.plates.find(x=>x.id===p)?.slots.find(x=>x.id===s)}
function takeScrew(pid,sid){if(state.paused||state.ended)return;const plate=state.plates.find(p=>p.id===pid),slot=findScrew(pid,sid);if(!slot||!slot.color)return;
const idx=state.plates.indexOf(plate);if(state.plates.slice(idx+1).some(p=>p.slots.some(s=>s.color))){sound('bad');toast('पहले ऊपर वाली प्लेट के स्क्रू निकालें');return}
sound();const color=slot.color;slot.color=null;state.removed++;
let box=state.boxes.find(b=>!b.ad&&b.color===color&&b.count<3);
if(box){box.count++;if(box.count===3){sound('win');setTimeout(()=>recycle(box),450)}}else{const empty=state.buffer.indexOf(null);if(empty<0){slot.color=color;state.removed--;state.ended=true;sound('bad');showDialog('गेम ओवर!','बफर के सभी स्लॉट भर गए हैं।');return}state.buffer[empty]=color}
const left=plate.slots.filter(s=>s.color);if(left.length===1){plate.hanging=true;plate.pivot=left[0]===plate.slots[0]?'20% 50%':'80% 50%';plate.rot+=left[0]===plate.slots[0]?70:-70}
if(!left.length){const el=$(pid);if(el)el.classList.add('falling');setTimeout(()=>{state.plates=state.plates.filter(p=>p.id!==pid);renderField()},350)}
moveBuffer();render();if(state.removed>=state.total)winLevel()}
function moveBuffer(){state.buffer.forEach((c,i)=>{if(!c)return;const b=state.boxes.find(x=>!x.ad&&x.color===c&&x.count<3);if(b){b.count++;state.buffer[i]=null;if(b.count===3)setTimeout(()=>recycle(b),450)}})}
function recycle(box){if(state.ended)return;const left=state.plates.flatMap(p=>p.slots.filter(s=>s.color).map(s=>s.color)).concat(state.buffer.filter(Boolean));box.count=0;box.color=left[0]||COLORS[(state.level+state.boxes.indexOf(box))%4];render()}
function unlockExtra(i){if(state.ended||state.paused)return;if(state.coins<30){toast('अतिरिक्त बॉक्स के लिए 30 सिक्के चाहिए');return}state.coins-=30;const used=state.boxes.filter(b=>!b.ad).map(b=>b.color);state.boxes[i]={color:COLORS.find(c=>!used.includes(c))||'brown',count:0};sound('win');render();save();toast('अतिरिक्त बॉक्स खुल गया!')}
function updateProgress(){const pct=state.total?Math.min(100,Math.floor(state.removed/state.total*100)):0;$('progress').style.width=pct+'%';$('percent').textContent=pct+'% पूरा'}
function winLevel(){if(state.ended)return;state.ended=true;state.won=true;state.coins+=25;save();sound('win');setTimeout(()=>showDialog('शानदार जीत! 🏆','लेवल '+state.level+' पूरा हुआ। आपको 25 बोनस सिक्के मिले।'),350)}
function showDialog(title,msg,second=false){$('dialogTitle').textContent=title;$('dialogText').textContent=msg;$('overlay').style.display='flex';$('mainAction').textContent=state.won?'अगला लेवल ➜':state.paused?'जारी रखें':'फिर कोशिश करें';$('secondAction').style.display=second?'block':'none'}
function hideDialog(){$('overlay').style.display='none'}
$('mainAction').onclick=()=>{if(state.won){state.level++;save();newLevel()}else if(state.paused){state.paused=false;hideDialog()}else{newLevel()}};
$('secondAction').onclick=()=>{newLevel()};
$('pauseBtn').onclick=()=>{if(state.ended)return;state.paused=true;showDialog('गेम पॉज़ ⏸️','आपका गेम सुरक्षित है। आराम से वापस शुरू करें।',true)};
function useBoost(type){if(state.paused||state.ended)return;if(state.boost[type]<=0){toast('यह बूस्टर खत्म हो गया है');return}
if(type==='drill'){let target=null;for(let p of [...state.plates].reverse()){const s=p.slots.find(x=>x.color);if(s){target=[p,s];break}}if(!target){toast('कोई स्क्रू उपलब्ध नहीं');return}state.boost.drill--;takeScrew(target[0].id,target[1].id)}
if(type==='hammer'){const p=state.plates[state.plates.length-1];if(!p){toast('कोई प्लेट नहीं');return}state.boost.hammer--;const n=p.slots.filter(s=>s.color).length;state.removed+=n;p.slots.forEach(s=>s.color=null);state.plates.pop();sound('win');render();if(state.removed>=state.total)winLevel()}
if(type==='cleaner'){const colors=state.buffer.filter(Boolean);if(!colors.length){toast('बफर पहले से खाली है');return}state.boost.cleaner--;state.buffer.fill(null);sound();render();toast('बफर साफ कर दिया गया')}
['drill','hammer','cleaner'].forEach(k=>$(k+'Count').textContent=state.boost[k]);}
document.querySelectorAll('[data-boost]').forEach(b=>b.onclick=()=>useBoost(b.dataset.boost));
function resetBoosters(){state.boost={drill:2,hammer:1,cleaner:1};['drill','hammer','cleaner'].forEach(k=>$(k+'Count').textContent=state.boost[k])}
const originalNewLevel=newLevel;
function start(){newLevel()}
start();
})();
</script>
</body>
</html>
