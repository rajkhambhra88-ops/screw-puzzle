<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Screw Jam 3D - Cinematic Neon</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    min-height: 100dvh;
    background: radial-gradient(circle at 50% 30%, #172033 0%, #080b12 75%, #020408 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  #game-viewport {
    width: min(100%, 450px);
    height: 100dvh;
    max-height: 920px;
    background: radial-gradient(ellipse at 50% 25%, #161e2e 0%, #0c1017 65%, #05070a 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 60px rgba(0, 229, 255, 0.15);
    overflow: hidden;
  }

  /* HUD Header */
  .top-hud {
    height: 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: linear-gradient(180deg, rgba(20, 28, 44, 0.95), rgba(10, 14, 22, 0.95));
    border-bottom: 1px solid rgba(0, 229, 255, 0.25);
    z-index: 100;
  }
  .hud-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 3px 6px rgba(0,0,0,0.6);
    font-size: 17px;
    font-weight: 900;
    color: #00e5ff;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .hud-btn:active { transform: scale(0.92); }
  .hud-title { text-align: center; }
  .title-main {
    font-size: 19px;
    font-weight: 1000;
    letter-spacing: 1.5px;
    background: linear-gradient(180deg, #ffffff 20%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title-sub {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #00e5ff;
  }
  .coin-pill {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border: 1px solid #eab308;
    padding: 5px 12px;
    border-radius: 14px;
    font-weight: 900;
    color: #facc15;
    font-size: 13px;
    box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Progress Line */
  .rail-bar {
    height: 4px;
    background: #111827;
    width: 100%;
    z-index: 90;
  }
  #fill-line {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00e5ff, #00ff66, #ffea00);
    box-shadow: 0 0 10px #00e5ff;
    transition: width 0.35s ease;
  }

  /* 3D Toolboxes */
  .boxes-dock {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 12px 14px 6px;
    z-index: 90;
  }
  .tool-box {
    width: clamp(74px, 21vw, 88px);
    height: clamp(66px, 18vw, 76px);
    border-radius: 16px;
    background: linear-gradient(145deg, #1a2333, #0a0e17);
    border: 2px solid rgba(255,255,255,0.12);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 4px;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.15),
                0 10px 20px rgba(0,0,0,0.6);
  }
  .tool-box.box-blue   { border-color: #00e5ff; box-shadow: 0 0 16px rgba(0, 229, 255, 0.35); }
  .tool-box.box-pink   { border-color: #ff0055; box-shadow: 0 0 16px rgba(255, 0, 85, 0.35); }
  .tool-box.box-yellow { border-color: #ffea00; box-shadow: 0 0 16px rgba(255, 234, 0, 0.35); }
  .tool-box.box-green  { border-color: #00ff66; box-shadow: 0 0 16px rgba(0, 255, 102, 0.35); }

  .box-socket {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #020305, #121824);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: inset 2px 2px 5px #000;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .tool-box.ad-slot {
    border: 2px dashed #ffea00;
    cursor: pointer;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }
  .tool-box.ad-slot span { font-size: 26px; color: #ffea00; line-height: 1; }
  .tool-box.ad-slot small { font-size: 8px; font-weight: 900; background: #eab308; color: #000; padding: 1px 5px; border-radius: 4px; }

  /* Buffer Rack */
  .buffer-deck {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 6px 14px 10px;
    z-index: 90;
  }
  .buffer-cup {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #1e293b, #05070a);
    border: 1px solid rgba(0, 229, 255, 0.3);
    box-shadow: inset 3px 3px 6px #000, 0 0 8px rgba(0, 229, 255, 0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* 3D Dark Studio Arena */
  .arena {
    flex: 1;
    position: relative;
    margin: 4px 12px 10px;
    border-radius: 26px;
    background: radial-gradient(ellipse at 50% 40%, #151d2c 0%, #0d121c 65%, #06090e 100%);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 0 35px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  .arena::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(0, 229, 255, 0.12) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    pointer-events: none;
  }

  /* Glowing Acrylic Neon Plates */
  .neon-plate {
    position: absolute;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    padding: 0 10px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.6);
    transition: transform 0.65s cubic-bezier(0.34, 1.45, 0.64, 1), opacity 0.4s;
    will-change: transform;
  }
  .neon-plate::after {
    content: '';
    position: absolute;
    width: 80%;
    height: 3px;
    border-radius: 2px;
    pointer-events: none;
    opacity: 0.8;
  }

  .plate-blue {
    background: rgba(0, 180, 255, 0.35);
    border: 3px solid #00e5ff;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.4), inset 0 0 12px rgba(0, 229, 255, 0.3);
  }
  .plate-blue::after { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }

  .plate-pink {
    background: rgba(255, 0, 85, 0.35);
    border: 3px solid #ff0055;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.4), inset 0 0 12px rgba(255, 0, 85, 0.3);
  }
  .plate-pink::after { background: #ff0055; box-shadow: 0 0 8px #ff0055; }

  .plate-yellow {
    background: rgba(255, 234, 0, 0.35);
    border: 3px solid #ffea00;
    box-shadow: 0 0 20px rgba(255, 234, 0, 0.4), inset 0 0 12px rgba(255, 234, 0, 0.3);
  }
  .plate-yellow::after { background: #ffea00; box-shadow: 0 0 8px #ffea00; }

  .plate-green {
    background: rgba(0, 255, 102, 0.35);
    border: 3px solid #00ff66;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.4), inset 0 0 12px rgba(0, 255, 102, 0.3);
  }
  .plate-green::after { background: #00ff66; box-shadow: 0 0 8px #00ff66; }

  /* Plate Hole Socket */
  .acrylic-hole {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #05070a 45%, #131b26 80%, #202d40 100%);
    border: 1.5px solid rgba(255,255,255,0.4);
    box-shadow: inset 2px 2px 5px #000, 0 0 8px rgba(0, 229, 255, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    flex-shrink: 0;
  }

  /* 3D Chrome Screws */
  .metallic-screw {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #cbd5e1 35%, #475569 70%, #1e293b 100%);
    border: 2px solid #94a3b8;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.9),
                inset 0 -3px 4px rgba(0,0,0,0.8),
                0 6px 12px rgba(0,0,0,0.6);
    cursor: pointer;
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: filter 0.2s, transform 0.1s;
  }
  .metallic-screw::before, .metallic-screw::after {
    content: '';
    position: absolute;
    background: #0f172a;
    border-radius: 2px;
    box-shadow: 0 1px 1px rgba(255,255,255,0.6);
  }
  .metallic-screw::before { width: 15px; height: 3.5px; }
  .metallic-screw::after  { width: 3.5px; height: 15px; }

  .screw-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.85;
  }
  .ring-blue   { border: 2px solid #00e5ff; box-shadow: 0 0 8px #00e5ff; }
  .ring-pink   { border: 2px solid #ff0055; box-shadow: 0 0 8px #ff0055; }
  .ring-yellow { border: 2px solid #ffea00; box-shadow: 0 0 8px #ffea00; }
  .ring-green  { border: 2px solid #00ff66; box-shadow: 0 0 8px #00ff66; }

  .metallic-screw.locked {
    filter: brightness(0.4) saturate(0.5);
    cursor: not-allowed;
  }
  .metallic-screw.shake {
    animation: buzzAnim 0.3s ease;
  }
  @keyframes buzzAnim {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px) rotate(-15deg); }
    75% { transform: translateX(5px) rotate(15deg); }
  }

  .screw-mini { width: 17px; height: 17px; }
  .screw-mini::before { width: 8px; height: 2px; }
  .screw-mini::after  { width: 2px; height: 8px; }

  /* 3D Flying Screw */
  .flying-screw {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    transition: all 0.42s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    transform: translate(-50%, -50%) scale(1.25) rotate(720deg);
  }

  /* Bottom Boosters */
  .boosters-dock {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 16px 65px;
    background: linear-gradient(180deg, rgba(16, 24, 38, 0.95), #06090e);
    border-top: 1px solid rgba(0, 229, 255, 0.2);
    z-index: 90;
  }
  .boost-card {
    width: 30%;
    height: 54px;
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border: 1.5px solid rgba(0, 229, 255, 0.4);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  .boost-card:active { transform: translateY(2px); }
  .boost-badge {
    font-size: 11px;
    font-weight: 1000;
    background: #00e5ff;
    color: #000;
    padding: 1px 6px;
    border-radius: 6px;
  }

  /* Dialogs */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 500;
    padding: 20px;
  }
  .glow-dialog {
    width: min(340px, 90%);
    background: linear-gradient(145deg, #131c2e, #090e17);
    border: 2px solid #00e5ff;
    box-shadow: 0 0 35px rgba(0, 229, 255, 0.35);
    border-radius: 24px;
    padding: 24px 20px;
    text-align: center;
  }
  .glow-dialog h2 {
    font-size: 26px;
    font-weight: 1000;
    color: #fff;
    margin-bottom: 8px;
  }
  .glow-dialog p {
    font-size: 14px;
    font-weight: 700;
    color: #94a3b8;
    line-height: 1.5;
  }
  .glow-btn {
    margin-top: 18px;
    width: 100%;
    padding: 12px 0;
    background: linear-gradient(135deg, #00e5ff, #0284c7);
    color: #000;
    border: none;
    font-size: 16px;
    font-weight: 1000;
    border-radius: 14px;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    cursor: pointer;
  }
  .glow-btn.sec {
    background: #1e293b;
    color: #cbd5e1;
    box-shadow: none;
    margin-top: 8px;
  }

  .toast {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid #00e5ff;
    color: #00e5ff;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    z-index: 600;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="game-viewport">
  <header class="top-hud">
    <button class="hud-btn" onclick="togglePause()">❚❚</button>
    <div class="hud-title">
      <div class="title-main" id="lvl-display">LEVEL 1</div>
      <div class="title-sub">SCREW JAM 3D</div>
    </div>
    <div class="coin-pill">🪙 <span id="coin-display">100</span></div>
  </header>

  <div class="rail-bar">
    <div id="fill-line"></div>
  </div>

  <section class="boxes-dock" id="boxes-container"></section>
  <section class="buffer-deck" id="buffer-container"></section>
  <main class="arena" id="arena"></main>

  <footer class="boosters-dock">
    <button class="boost-card" onclick="useBooster('drill')">
      <span style="font-size:22px;">🪛</span>
      <span class="boost-badge" id="drill-count">2</span>
    </button>
    <button class="boost-card" onclick="useBooster('hammer')">
      <span style="font-size:22px;">🔨</span>
      <span class="boost-badge" id="hammer-count">1</span>
    </button>
    <button class="boost-card" onclick="useBooster('cleaner')">
      <span style="font-size:22px;">🧹</span>
      <span class="boost-badge" id="cleaner-count">1</span>
    </button>
  </footer>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="win-modal">
    <div class="glow-dialog">
      <h2>शानदार जीत! 🏆</h2>
      <p>लेवल पूरा हुआ! आपको 25 बोनस सिक्के मिले।</p>
      <button class="glow-btn" onclick="nextLevel()">अगला लेवल ➔</button>
    </div>
  </div>

  <div class="overlay" id="fail-modal">
    <div class="glow-dialog">
      <h2 style="color:#ff0055;">गेम ओवर! ⚠️</h2>
      <p>बफ़र के सभी स्लॉट भर गए हैं।</p>
      <button class="glow-btn" style="background:#ff0055; color:#fff;" onclick="retryLevel()">पुनः प्रयास करें</button>
    </div>
  </div>

  <div class="overlay" id="pause-modal">
    <div class="glow-dialog">
      <h2>गेम रुका हुआ है ⏸️</h2>
      <p>आपकी प्रगति सुरक्षित है।</p>
      <button class="glow-btn" onclick="togglePause()">जारी रखें</button>
      <button class="glow-btn sec" onclick="retryLevel()">लेवल दोबारा शुरू करें</button>
    </div>
  </div>

  <div class="overlay" id="ad-timer-modal">
    <div class="glow-dialog">
      <h2>प्रचार देखा जा रहा है... 🎬</h2>
      <div style="font-size:40px; margin:15px auto;">🎁</div>
      <p id="ad-timer-text">अतिरिक्त बॉक्स अनलॉक हो रहा है: 5s</p>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  let audioCtx;
  function playSound(type) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'unscrew') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.linearRampToValueAtTime(950, now + 0.14);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'land') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.setValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'box-full') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.08);
        osc.frequency.setValueAtTime(783, now + 0.16);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
      } else if (type === 'blocked') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.setValueAtTime(90, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      }
    } catch(e) {}
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1500);
  }

  const NEON_COLORS = ['blue', 'pink', 'yellow', 'green'];

  let level = Math.max(1, parseInt(localStorage.getItem('sj3_level') || '1'));
  let coins = Math.max(0, parseInt(localStorage.getItem('sj3_coins') || '100'));
  let boxes = [];
  let buffer = [null, null, null, null, null];
  let plates = [];
  let totalScrews = 0;
  let removedCount = 0;
  let boosters = { drill: 2, hammer: 1, cleaner: 1 };
  let isPaused = false;
  let isGameOver = false;

  function saveGame() {
    localStorage.setItem('sj3_level', level);
    localStorage.setItem('sj3_coins', coins);
  }

  function buildLevel(lvl) {
    let plateCount, activeColors;
    if (lvl === 1) {
      plateCount = 2;
      activeColors = ['blue', 'yellow'];
    } else if (lvl === 2) {
      plateCount = 3;
      activeColors = ['blue', 'pink', 'yellow'];
    } else {
      plateCount = Math.min(10, 4 + Math.floor((lvl - 3) * 0.7));
      activeColors = NEON_COLORS;
    }

    boxes = [
      { type: 'box', color: activeColors[0], count: 0 },
      { type: 'box', color: activeColors[1] || activeColors[0], count: 0 },
      { type: 'ad', unlocked: false },
      { type: 'ad', unlocked: false }
    ];

    buffer = [null, null, null, null, null];
    plates = [];
    let screwCounter = 1;

    for (let i = 0; i < plateCount; i++) {
      let topPos = 45 + (i * 28) + (Math.sin(i * 1.5) * 16);
      let leftPos = 22 + ((i % 3) * 65) + (Math.cos(i) * 20);
      let baseRot = -25 + ((i * 35) % 65);
      let pColor = activeColors[i % activeColors.length];

      let numSlots = (lvl === 1) ? 2 : (i % 2 === 0 ? 2 : 3);
      let slots = [];

      for (let s = 0; s < numSlots; s++) {
        let scColor = activeColors[(i + s) % activeColors.length];
        slots.push({
          slotId: s,
          color: scColor,
          screwId: 's_' + (screwCounter++)
        });
      }

      plates.push({
        id: 'p_' + (i + 1),
        layer: i,
        top: Math.round(topPos),
        left: Math.round(leftPos),
        currentRot: baseRot,
        pivotOrigin: 'center center',
        color: pColor,
        slots: slots,
        isHanging: false,
        hangBaseAngle: 0,
        swingPhase: Math.random() * Math.PI * 2,
        swingSpeed: 1.8 + Math.random() * 0.6,
        swingAmplitude: 12 + Math.random() * 6
      });
    }

    totalScrews = 0;
    plates.forEach(p => p.slots.forEach(s => { if (s.color) totalScrews++; }));
    removedCount = 0;
    isGameOver = false;
    isPaused = false;

    document.getElementById('lvl-display').textContent = `LEVEL ${lvl}`;
    document.getElementById('coin-display').textContent = coins;
    updateProgress();
    renderBoxes();
    renderBuffer();
    renderArena();
  }

  function isScrewPhysicallyBlocked(screwElem, plateId) {
    if (!screwElem) return false;
    const r = screwElem.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    const stack = document.elementsFromPoint(cx, cy);
    const myIdx = plates.findIndex(p => p.id === plateId);

    for (let el of stack) {
      const parent = el.closest('.neon-plate');
      if (parent && parent.id !== plateId) {
        const otherIdx = plates.findIndex(p => p.id === parent.id);
        if (otherIdx > myIdx) return true;
      }
    }
    return false;
  }

  function renderBoxes() {
    const root = document.getElementById('boxes-container');
    root.innerHTML = '';

    boxes.forEach((b, idx) => {
      const card = document.createElement('div');
      card.className = 'tool-box';
      card.id = 'box-card-' + idx;

      if (b.type === 'box') {
        card.classList.add('box-' + b.color);
        for (let i = 0; i < 3; i++) {
          const socket = document.createElement('div');
          socket.className = 'box-socket';
          socket.id = `box-hole-${idx}-${i}`;
          if (i < b.count) {
            const sc = document.createElement('div');
            sc.className = 'metallic-screw screw-mini';
            const ring = document.createElement('div');
            ring.className = `screw-ring ring-${b.color}`;
            sc.appendChild(ring);
            socket.appendChild(sc);
          }
          card.appendChild(socket);
        }
      } else {
        card.classList.add('ad-slot');
        card.innerHTML = `<span>+</span><small>EXTRA</small>`;
        card.onclick = () => watchRewardedAd(idx);
      }
      root.appendChild(card);
    });
  }

  function renderBuffer() {
    const root = document.getElementById('buffer-container');
    root.innerHTML = '';
    buffer.forEach((c, idx) => {
      const cup = document.createElement('div');
      cup.className = 'buffer-cup';
      cup.id = 'buffer-cup-' + idx;
      if (c) {
        const sc = document.createElement('div');
        sc.className = 'metallic-screw screw-mini';
        const ring = document.createElement('div');
        ring.className = `screw-ring ring-${c}`;
        sc.appendChild(ring);
        cup.appendChild(sc);
      }
      root.appendChild(cup);
    });
  }

  function renderArena() {
    const root = document.getElementById('arena');
    root.innerHTML = '';

    plates.forEach((p, pIdx) => {
      const pEl = document.createElement('div');
      pEl.className = `neon-plate plate-${p.color}`;
      pEl.id = p.id;
      pEl.style.width = (p.slots.length === 2 ? 140 : 155) + 'px';
      pEl.style.height = '56px';
      pEl.style.top = p.top + 'px';
      pEl.style.left = p.left + 'px';
      pEl.style.transformOrigin = p.pivotOrigin;
      pEl.style.transform = `rotate(${p.currentRot}deg)`;
      pEl.style.zIndex = pIdx + 1;

      p.slots.forEach(s => {
        const socket = document.createElement('div');
        socket.className = 'acrylic-hole';

        if (s.color) {
          const sc = document.createElement('div');
          sc.className = 'metallic-screw';
          sc.id = s.screwId;

          const ring = document.createElement('div');
          ring.className = `screw-ring ring-${s.color}`;
          sc.appendChild(ring);

          sc.onclick = (e) => {
            e.stopPropagation();
            onScrewTap(p.id, s.screwId, s.color, sc);
          };
          socket.appendChild(sc);
        }
        pEl.appendChild(socket);
      });

      root.appendChild(pEl);
    });
  }

  let lastTime = performance.now();
  function physicsEngine(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    plates.forEach(p => {
      if (p.isHanging) {
        p.swingPhase += p.swingSpeed * dt;
        const sway = Math.sin(p.swingPhase) * p.swingAmplitude;
        p.currentRot = p.hangBaseAngle + sway;

        const el = document.getElementById(p.id);
        if (el) {
          el.style.transformOrigin = p.pivotOrigin;
          el.style.transform = `rotate(${p.currentRot}deg)`;
        }
      }
    });

    plates.forEach(p => {
      p.slots.forEach(s => {
        if (s.color) {
          const sc = document.getElementById(s.screwId);
          if (sc) {
            if (isScrewPhysicallyBlocked(sc, p.id)) {
              sc.classList.add('locked');
            } else {
              sc.classList.remove('locked');
            }
          }
        }
      });
    });

    requestAnimationFrame(physicsEngine);
  }
  requestAnimationFrame(physicsEngine);

  function animateScrewFlight(startElem, targetElem, color, onComplete) {
    const sRect = startElem.getBoundingClientRect();
    const tRect = targetElem.getBoundingClientRect();

    const ghost = document.createElement('div');
    ghost.className = 'metallic-screw flying-screw';
    const ring = document.createElement('div');
    ring.className = `screw-ring ring-${color}`;
    ghost.appendChild(ring);

    ghost.style.left = (sRect.left + sRect.width / 2) + 'px';
    ghost.style.top = (sRect.top + sRect.height / 2) + 'px';
    document.body.appendChild(ghost);

    playSound('unscrew');

    requestAnimationFrame(() => {
      ghost.style.left = (tRect.left + tRect.width / 2) + 'px';
      ghost.style.top = (tRect.top + tRect.height / 2) + 'px';
      ghost.style.transform = 'translate(-50%, -50%) scale(0.65) rotate(720deg)';
    });

    setTimeout(() => {
      ghost.remove();
      playSound('land');
      if (onComplete) onComplete();
    }, 420);
  }

  function onScrewTap(plateId, screwId, color, screwElem) {
    if (isPaused || isGameOver) return;

    if (isScrewPhysicallyBlocked(screwElem, plateId)) {
      playSound('blocked');
      screwElem.classList.remove('shake');
      void screwElem.offsetWidth;
      screwElem.classList.add('shake');
      showToast('ऊपर की प्लेट हटने तक यह लॉक है!');
      return;
    }

    let targetBoxIdx = boxes.findIndex(b => b.type === 'box' && b.color === color && b.count < 3);
    let destElem = null;
    let targetMode = '';

    if (targetBoxIdx !== -1) {
      targetMode = 'box';
      const slotNum = boxes[targetBoxIdx].count;
      destElem = document.getElementById(`box-hole-${targetBoxIdx}-${slotNum}`);
    } else {
      let emptyBuf = buffer.indexOf(null);
      if (emptyBuf !== -1) {
        targetMode = 'buffer';
        destElem = document.getElementById(`buffer-cup-${emptyBuf}`);
      } else {
        playSound('blocked');
        showToast('बफ़र स्लॉट भर गए हैं!');
        checkFailCondition();
        return;
      }
    }

    const plate = plates.find(p => p.id === plateId);
    if (!plate) return;
    const slot = plate.slots.find(s => s.screwId === screwId);
    if (!slot) return;
    slot.color = null;
    screwElem.remove();

    animateScrewFlight(screwElem, destElem, color, () => {
      removedCount++;
      if (targetMode === 'box') {
        boxes[targetBoxIdx].count++;
        if (boxes[targetBoxIdx].count === 3) {
          playSound('box-full');
          setTimeout(() => recycleBox(boxes[targetBoxIdx]), 350);
        }
      } else {
        const emptyBuf = buffer.indexOf(null);
        if (emptyBuf !== -1) buffer[emptyBuf] = color;
      }

      checkBufferHops();
      renderBoxes();
      renderBuffer();
      updateProgress();
      checkWinCondition();
    });

    handlePlateBalance(plate);
  }

  function handlePlateBalance(plate) {
    const leftSlots = plate.slots.filter(s => s.color !== null);

    if (leftSlots.length === 0) {
      plate.isHanging = false;
      const el = document.getElementById(plate.id);
      if (el) {
        el.style.transform += ' scale(1.15) translateY(-50px)';
        el.style.opacity = '0';
        setTimeout(() => {
          plates = plates.filter(p => p.id !== plate.id);
          renderArena();
        }, 450);
      }
      return;
    }

    if (leftSlots.length === 1) {
      const pivot = leftSlots[0];
      const tot = plate.slots.length;
      let pct = (tot === 2)
        ? (pivot.slotId === 0 ? '25%' : '75%')
        : (pivot.slotId === 0 ? '18%' : (pivot.slotId === 1 ? '50%' : '82%'));

      plate.pivotOrigin = `${pct} 50%`;
      plate.isHanging = true;

      if (tot === 2) {
        plate.hangBaseAngle = (pivot.slotId === 0) ? 82 : -82;
      } else {
        plate.hangBaseAngle = (pivot.slotId === 0) ? 82 : (pivot.slotId === 2 ? -82 : 80);
      }
      plate.currentRot = plate.hangBaseAngle;
    }
  }

  function checkBufferHops() {
    buffer.forEach((c, i) => {
      if (!c) return;
      let match = boxes.find(b => b.type === 'box' && b.color === c && b.count < 3);
      if (match) {
        match.count++;
        buffer[i] = null;
        if (match.count === 3) {
          playSound('box-full');
          setTimeout(() => recycleBox(match), 350);
        }
      }
    });
  }

  function recycleBox(box) {
    box.count = 0;
    const remaining = [];
    plates.forEach(p => p.slots.forEach(s => { if (s.color) remaining.push(s.color); }));
    buffer.forEach(c => { if (c) remaining.push(c); });

    if (remaining.length > 0) {
      box.color = remaining[Math.floor(Math.random() * remaining.length)];
    } else {
      box.color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
    }

    renderBoxes();
    checkBufferHops();
  }

  function watchRewardedAd(boxIdx) {
    if (boxes[boxIdx].unlocked) return;
    playSound('unscrew');

    const modal = document.getElementById('ad-timer-modal');
    const timerText = document.getElementById('ad-timer-text');
    modal.style.display = 'flex';

    let sec = 5;
    timerText.textContent = `अतिरिक्त बॉक्स अनलॉक हो रहा है: ${sec}s`;

    const timer = setInterval(() => {
      sec--;
      if (sec > 0) {
        timerText.textContent = `अतिरिक्त बॉक्स अनलॉक हो रहा है: ${sec}s`;
      } else {
        clearInterval(timer);
        modal.style.display = 'none';

        const active = boxes.filter(b => b.type === 'box').map(b => b.color);
        const nextColor = NEON_COLORS.find(c => !active.includes(c)) || 'green';
        boxes[boxIdx] = { type: 'box', color: nextColor, count: 0, unlocked: true };

        playSound('box-full');
        showToast('चौथा बॉक्स सफलतापूर्वक अनलॉक हुआ! 🎉');
        renderBoxes();
        checkBufferHops();
      }
    }, 1000);
  }

  function updateProgress() {
    const pct = totalScrews > 0 ? Math.min(100, Math.floor((removedCount / totalScrews) * 100)) : 100;
    document.getElementById('fill-line').style.width = pct + '%';
  }

  function checkWinCondition() {
    if (removedCount >= totalScrews && totalScrews > 0) {
      isGameOver = true;
      coins += 25;
      saveGame();
      playSound('box-full');
      setTimeout(() => {
        document.getElementById('win-modal').style.display = 'flex';
      }, 550);
    }
  }

  function checkFailCondition() {
    if (buffer.every(c => c !== null)) {
      isGameOver = true;
      playSound('blocked');
      document.getElementById('fail-modal').style.display = 'flex';
    }
  }

  window.nextLevel = function() {
    document.getElementById('win-modal').style.display = 'none';
    level++;
    saveGame();
    buildLevel(level);
  };

  window.retryLevel = function() {
    document.getElementById('fail-modal').style.display = 'none';
    document.getElementById('pause-modal').style.display = 'none';
    buildLevel(level);
  };

  window.togglePause = function() {
    isPaused = !isPaused;
    document.getElementById('pause-modal').style.display = isPaused ? 'flex' : 'none';
  };

  window.useBooster = function(type) {
    if (isPaused || isGameOver) return;
    if (boosters[type] <= 0) {
      showToast('यह बूस्टर समाप्त हो गया है!');
      return;
    }

    if (type === 'drill') {
      for (let i = plates.length - 1; i >= 0; i--) {
        const p = plates[i];
        for (let s of p.slots) {
          if (s.color) {
            const sc = document.getElementById(s.screwId);
            if (sc && !isScrewPhysicallyBlocked(sc, p.id)) {
              boosters.drill--;
              document.getElementById('drill-count').textContent = boosters.drill;
              onScrewTap(p.id, s.screwId, s.color, sc);
              return;
            }
          }
        }
      }
      showToast('कोई अनलॉक स्क्रू नहीं मिला!');
    } else if (type === 'hammer') {
      if (plates.length > 0) {
        const topPlate = plates[plates.length - 1];
        boosters.hammer--;
        document.getElementById('hammer-count').textContent = boosters.hammer;
        removedCount += topPlate.slots.filter(s => s.color !== null).length;
        plates.pop();
        playSound('box-full');
        renderArena();
        updateProgress();
        checkWinCondition();
        showToast('हथौड़े से शीर्ष प्लेट हटा दी गई!');
      }
    } else if (type === 'cleaner') {
      if (buffer.every(c => c === null)) {
        showToast('बफ़र पहले से खाली है!');
        return;
      }
      boosters.cleaner--;
      document.getElementById('cleaner-count').textContent = boosters.cleaner;
      buffer = [null, null, null, null, null];
      playSound('unscrew');
      renderBuffer();
      showToast('बफ़र पूरी तरह साफ़ कर दिया गया!');
    }
  };

  buildLevel(level);
})();
</script>
</body>
</html>
