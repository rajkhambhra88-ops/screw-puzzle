<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#EFE3C6">
<title>3D Screw Runner - Box Targets</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#EFE3C6;font-family:'Segoe UI',Arial,sans-serif;user-select:none;touch-action:none;}

/* Game Container */
#game{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;}

/* ===== TOP TARGET BOXES ===== */
#top-boxes{
  position:absolute;top:70px;left:0;width:100%;
  display:flex;justify-content:center;gap:15px;z-index:90;
  padding:0 10px;
}
.target-box{
  flex:1;max-width:100px;height:70px;
  background:#FFF;
  border-radius:15px;
  border:4px solid #555;
  box-shadow:0 6px 0 #555;
  position:relative;
  display:flex;justify-content:center;align-items:center;gap:5px;
  overflow:hidden;
}
.target-box .bg-fill{
  position:absolute;bottom:0;left:0;width:100%;height:0%;
  transition:height 0.3s ease;
  opacity:0.3;
}
.target-box .screw-slot{
  width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,0.1);border:2px dashed #999;
  display:flex;justify-content:center;align-items:center;
  font-size:14px;font-weight:bold;color:#999;
  z-index:2;
}
.target-box.filled .screw-slot{
  border:2px solid transparent;background:transparent;color:#FFF;
}

/* Box Colors */
#boxRed .bg-fill{background:#FF4A4A;}
#boxRed{border-color:#FF4A4A;box-shadow:0 6px 0 #A02A2A;}
#boxGreen .bg-fill{background:#4CAF50;}
#boxGreen{border-color:#4CAF50;box-shadow:0 6px 0 #2E7D32;}
#boxBlue .bg-fill{background:#4A78FF;}
#boxBlue{border-color:#4A78FF;box-shadow:0 6px 0 #2A4AA0;}

/* Flying Screw Animation */
.flying-screw{
  position:fixed;
  width:24px;height:24px;
  background:#A0A0A0;
  border-radius:50%;
  border:2px solid #666;
  display:flex;justify-content:center;align-items:center;
  font-size:16px;font-weight:bold;color:#FFF;
  z-index:999;pointer-events:none;
  box-shadow:0 4px 8px rgba(0,0,0,0.4);
  transition:all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

/* ===== 3D ROAD SETUP ===== */
#track-container{
  position:relative;flex:1;overflow:hidden;
  perspective:800px;
  perspective-origin:50% 20%;
  margin-top:160px; /* Space for boxes */
}

#road{
  position:absolute;left:50%;bottom:0;
  width:340px;height:200%;
  transform:translateX(-50%) rotateX(55deg);
  transform-origin:bottom center;
  transform-style:preserve-3d;
  background:#D4C4A3;
  border-left:10px solid #C2B08D;
  border-right:10px solid #C2B08D;
  box-shadow:0 0 50px rgba(0,0,0,0.2) inset;
}

.lane-line{
  position:absolute;top:0;bottom:0;width:8px;
  background:repeating-linear-gradient(180deg,#FFF 0px,#FFF 40px,transparent 40px,transparent 80px);
  box-shadow:0 0 10px rgba(255,255,255,0.8);
  animation:moveRoad 1s linear infinite;
}
.lane-1{left:33.33%;transform:translateX(-50%);}
.lane-2{left:66.66%;transform:translateX(-50%);}
@keyframes moveRoad{from{background-position-y:0}to{background-position-y:80px}}

/* ===== PLAYER ===== */
#player{
  position:absolute;left:50%;bottom:15%;
  width:80px;height:80px;
  transform:translateX(-50%);
  transform-style:preserve-3d;
  z-index:10;
  transition:left 0.15s ease-out;
}
.plate-bg{
  position:absolute;inset:0;
  background:#FFF;
  border-radius:20px;
  border:4px solid #4A78FF;
  box-shadow:0 10px 0 #2A4AA0, 0 15px 20px rgba(0,0,0,0.3);
  display:flex;justify-content:center;align-items:center;gap:6px;
}
.plate-bg .hole{
  width:18px;height:18px;border-radius:50%;
  background:#A0A0A0;box-shadow:inset 0 3px 5px rgba(0,0,0,0.5);
}
#player.shielded .plate-bg{border-color:#00FF00 !important;box-shadow:0 10px 0 #008800, 0 0 30px #00FF00 !important;}

/* ===== OBSTACLES ===== */
.obstacle{
  position:absolute;width:90px;height:120px;
  transform-style:preserve-3d;
  background:#6B9B5E;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  border:3px solid #FFF;
  box-shadow:0 10px 15px rgba(0,0,0,0.2);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;
}
.obstacle.blue{background:#6BA8F0;}
.obstacle.purple{background:#B26FE8;}
.obstacle.green{background:#6B9B5E;}
.obstacle .screw{
  width:20px;height:20px;border-radius:50%;
  background:#A0A0A0;box-shadow:inset 0 3px 5px rgba(0,0,0,0.5);
  display:flex;justify-content:center;align-items:center;
}
.obstacle .screw::after{content:'+';color:#666;font-weight:bold;font-size:14px;line-height:1;}

/* ===== COLLECTIBLES (COLORED SCREWS) ===== */
.collectible-screw{
  position:absolute;width:30px;height:30px;border-radius:50%;
  border:3px solid #FFF;
  box-shadow:0 5px 10px rgba(0,0,0,0.3);
  display:flex;justify-content:center;align-items:center;
  font-size:18px;font-weight:bold;color:#FFF;
  z-index:8;animation:spin 2s linear infinite;
}
.collectible-screw.red{background:#FF4A4A;box-shadow:0 0 15px #FF4A4A,0 5px 10px rgba(0,0,0,0.3);}
.collectible-screw.green{background:#4CAF50;box-shadow:0 0 15px #4CAF50,0 5px 10px rgba(0,0,0,0.3);}
.collectible-screw.blue{background:#4A78FF;box-shadow:0 0 15px #4A78FF,0 5px 10px rgba(0,0,0,0.3);}
@keyframes spin{100%{transform:rotateY(360deg)}}

.powerup{
  position:absolute;width:44px;height:44px;border-radius:50%;
  display:flex;justify-content:center;align-items:center;
  font-size:24px;z-index:8;box-shadow:0 0 20px currentColor;
  animation:bounce 1s infinite alternate;
}
@keyframes bounce{from{transform:scale(1)}to{transform:scale(1.2)}}
.powerup.magnet{background:#FF00FF;color:#FFF;}

/* ===== UI OVERLAY (HUD) ===== */
#hud{
  position:absolute;top:0;left:0;right:0;padding:15px;
  display:flex;justify-content:space-between;align-items:flex-start;
  z-index:100;pointer-events:none;
}
.ui-box{
  background:rgba(255,255,255,0.9);
  border:3px solid #555;border-radius:15px;
  padding:8px 15px;font-size:18px;font-weight:bold;color:#333;
  box-shadow:0 5px 0 #555;text-align:center;
}
.ui-box .label{font-size:10px;color:#777;display:block;letter-spacing:1px;}

/* ===== SCREENS ===== */
.screen{
  position:absolute;inset:0;background:rgba(239,227,198,0.95);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  z-index:200;padding:20px;text-align:center;
}
.screen.hidden{display:none;}
.screen h1{font-size:32px;color:#333;margin-bottom:10px;text-shadow:0 3px 0 #FFF;}
.screen p{color:#555;font-size:16px;margin-bottom:20px;line-height:1.6;}

.btn{
  padding:15px 40px;font-size:20px;font-weight:bold;color:#FFF;
  background:#4A78FF;border:none;border-radius:15px;
  box-shadow:0 6px 0 #2A4AA0;cursor:pointer;
  transition:all 0.1s;margin-top:10px;width:80%;max-width:250px;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2A4AA0;}
.btn.red{background:#FF4A4A;box-shadow:0 6px 0 #A02A2A;}
.btn.green{background:#4CAF50;box-shadow:0 6px 0 #2E7D32;}

/* Ads Placeholder */
.ad-box{
  width:100%;max-width:300px;height:250px;
  background:#FFF;border:3px dashed #999;border-radius:15px;
  display:flex;justify-content:center;align-items:center;
  color:#999;font-size:18px;font-weight:bold;margin-top:20px;
}
.skip-btn{padding:8px 20px;background:#555;color:#FFF;border:none;border-radius:10px;font-size:14px;margin-top:15px;cursor:pointer;}

/* ===== POWERUP BAR ===== */
#powerup-bar{
  position:absolute;bottom:20px;left:0;width:100%;
  display:flex;justify-content:center;gap:15px;z-index:100;
}
.pu-icon{
  width:60px;height:60px;background:#FFF;border:3px solid #555;border-radius:15px;
  display:flex;justify-content:center;align-items:center;font-size:28px;
  box-shadow:0 5px 0 #555;position:relative;
}
.pu-icon .ad-badge{
  position:absolute;bottom:-5px;right:-5px;
  background:#4CAF50;color:#FFF;font-size:9px;font-weight:bold;
  padding:2px 5px;border-radius:5px;border:1px solid #FFF;
}

</style>
</head>
<body>

<div id="game">
  
  <!-- TOP TARGET BOXES -->
  <div id="top-boxes">
    <div class="target-box" id="boxRed">
      <div class="bg-fill"></div>
      <div class="screw-slot">0</div>
      <div class="screw-slot">0</div>
    </div>
    <div class="target-box" id="boxGreen">
      <div class="bg-fill"></div>
      <div class="screw-slot">0</div>
      <div class="screw-slot">0</div>
    </div>
    <div class="target-box" id="boxBlue">
      <div class="bg-fill"></div>
      <div class="screw-slot">0</div>
      <div class="screw-slot">0</div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="ui-box"><span class="label">SCORE</span><span id="score">0</span></div>
    <div class="ui-box"><span class="label">BEST</span><span id="best">0</span></div>
  </div>

  <!-- 3D Track -->
  <div id="track-container">
    <div id="road">
      <div class="lane-line lane-1"></div>
      <div class="lane-line lane-2"></div>
    </div>
    
    <!-- Player -->
    <div id="player">
      <div class="plate-bg">
        <div class="hole"></div><div class="hole"></div><div class="hole"></div>
      </div>
    </div>
  </div>

  <!-- Powerup Bar -->
  <div id="powerup-bar">
    <div class="pu-icon" id="puMagnet">🧲<div class="ad-badge">FREE</div></div>
  </div>

  <!-- Start Screen -->
  <div class="screen" id="startScreen">
    <h1>SCREW MATCH RUNNER</h1>
    <p>अपने रंग के स्क्रू इकट्ठा करें 🔩<br>ऊपर दिए गए बॉक्स में भरें!</p>
    <button class="btn green" id="btnStart">START GAME</button>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="gameOverScreen">
    <h1 style="color:#FF4A4A;">GAME OVER</h1>
    <p style="font-size:24px;font-weight:bold;color:#333;">Score: <span id="finalScore">0</span></p>
    <button class="btn green" id="btnRestart">PLAY AGAIN</button>
    <button class="btn" id="btnHome">HOME</button>
    <button class="btn red" id="btnRevive">REVIVE (AD)</button>
  </div>

  <!-- Ad Interstitial Screen -->
  <div class="screen hidden" id="adScreen">
    <h1>Advertisement</h1>
    <div class="ad-box">AdMob Placeholder</div>
    <button class="skip-btn" id="btnSkipAd">Skip Ad ▶</button>
  </div>

</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const player = $('player');
const track = $('track-container');
const startScreen = $('startScreen');
const gameOverScreen = $('gameOverScreen');
const adScreen = $('adScreen');
const scoreEl = $('score'), bestEl = $('best');

const flash = document.createElement('div');
flash.style.cssText = 'position:absolute;inset:0;background:#FF0000;opacity:0;pointer-events:none;z-index:90;transition:opacity 0.2s;';
$('game').appendChild(flash);

const LANES = [16.6, 50, 83.3];
let currentLane = 1;
let score = 0;
let best = parseInt(localStorage.getItem('screwRunnerBest') || '0', 10);
let isRunning = false;
let gameSpeed = 1;
let level = 1;
let spawnRate = 1200;
let lastSpawn = 0;
let scoreTimer;
let obstacles = [];
let items = []; // Collectibles
let activePowerups = { magnet: 0 };

// Box Logic Variables
const COLORS = ['red', 'green', 'blue'];
const BOX_CAPACITY = 2; // How many screws each box needs
let boxCounts = { red: 0, green: 0, blue: 0 };

bestEl.textContent = best;

// Audio (Same as before)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type === 'coin') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if(type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'fill') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
}

function movePlayer(dir) {
    if(!isRunning) return;
    let nextLane = currentLane + dir;
    if(nextLane >= 0 && nextLane <= 2) {
        currentLane = nextLane;
        player.style.left = LANES[currentLane] + '%';
    }
}

document.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1);
    if(e.key === 'ArrowRight' || e.key === 'd') movePlayer(1);
});
track.addEventListener('touchstart', e => {
    const x = e.touches[0].clientX;
    if(x < window.innerWidth / 2) movePlayer(-1);
    else movePlayer(1);
});

let lastTime = performance.now();
function gameLoop(time) {
    if(!isRunning) return;
    const dt = time - lastTime;
    lastTime = time;
    
    gameSpeed = 1 + (score * 0.002); 
    
    document.querySelectorAll('.lane-line').forEach(el => {
        el.style.animationDuration = (0.5 + (gameSpeed * 0.3)) + 's';
    });

    if(time - lastSpawn > spawnRate) {
        spawnObject();
        lastSpawn = time;
        spawnRate = Math.max(400, 1200 - (score * 10)); 
    }

    const trackHeight = track.offsetHeight;
    const playerTop = trackHeight - (trackHeight * 0.15) - 80;

    // Move Obstacles
    for(let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        let y = parseFloat(obs.style.top) || -150;
        y += (gameSpeed * 8 * (dt/16)); 
        obs.style.top = y + 'px';

        if(y > playerTop - 60 && y < playerTop + 80) {
            if(parseInt(obs.dataset.lane) === currentLane) {
                gameOver(); return;
            }
        }
        if(y > trackHeight + 200) { obs.remove(); obstacles.splice(i, 1); }
    }

    // Move Collectibles
    for(let i = items.length - 1; i >= 0; i--) {
        let p = items[i];
        let y = parseFloat(p.style.top) || -150;
        
        // Magnet effect
        if(activePowerups.magnet > 0) {
            let targetX = (track.offsetWidth * LANES[currentLane] / 100);
            let currentX = parseFloat(p.style.left) || targetX;
            p.style.left = (currentX + (targetX - currentX) * 0.1) + 'px';
            y += 3;
        } else {
            y += (gameSpeed * 8 * (dt/16));
        }
        
        p.style.top = y + 'px';

        // Collect Check
        if(y > playerTop - 40 && y < playerTop + 80) {
            let pX = parseFloat(p.style.left);
            let targetX = (track.offsetWidth * LANES[currentLane] / 100) - 15;
            
            if(Math.abs(pX - targetX) < 50) {
                if(p.dataset.type === 'screw') {
                    collectScrew(p.dataset.color, pX, y + 150); // y+150 because track is offset
                } else {
                    activatePowerup(p.dataset.type);
                }
                p.remove(); items.splice(i, 1);
                continue;
            }
        }
        if(y > trackHeight + 200) { p.remove(); items.splice(i, 1); }
    }

    requestAnimationFrame(gameLoop);
}

function spawnObject() {
    const lane = Math.floor(Math.random() * 3);
    // 70% chance for colored screw, 10% magnet, 20% obstacle
    const rand = Math.random();
    const el = document.createElement('div');
    el.dataset.lane = lane;
    const laneX = (track.offsetWidth * LANES[lane] / 100) - 45;
    el.style.left = laneX + 'px';
    el.style.top = '-150px';

    if(rand < 0.70) {
        // Colored Screw
        const color = COLORS[Math.floor(Math.random() * 3)];
        el.className = 'collectible-screw ' + color;
        el.textContent = '+'; // Looks like a screw head
        el.dataset.type = 'screw';
        el.dataset.color = color;
        track.appendChild(el);
        items.push(el);
    } else if (rand < 0.80) {
        // Magnet
        el.className = 'powerup magnet';
        el.textContent = '🧲';
        el.dataset.type = 'magnet';
        track.appendChild(el);
        items.push(el);
    } else {
        // Obstacle
        el.className = 'obstacle ' + COLORS[Math.floor(Math.random() * 3)];
        el.innerHTML = `<div class="screw"></div><div class="screw"></div>`;
        track.appendChild(el);
        obstacles.push(el);
    }
}

// Collect Screw Logic (Flying animation)
function collectScrew(color, startX, startY) {
    playSound('coin');
    
    // Create flying screw
    const flying = document.createElement('div');
    flying.className = 'flying-screw';
    flying.style.left = startX + 'px';
    flying.style.top = startY + 'px';
    // Start color
    flying.style.background = color === 'red' ? '#FF4A4A' : (color === 'green' ? '#4CAF50' : '#4A78FF');
    document.body.appendChild(flying);

    // Get target box center
    const targetBox = $('box' + color.charAt(0).toUpperCase() + color.slice(1));
    const rect = targetBox.getBoundingClientRect();
    
    // Animate to box
    requestAnimationFrame(() => {
        flying.style.left = (rect.left + rect.width/2 - 12) + 'px';
        flying.style.top = (rect.top + rect.height/2 - 12) + 'px';
        flying.style.transform = 'scale(0.5)';
    });

    // After animation ends
    setTimeout(() => {
        flying.remove();
        updateBox(color);
    }, 500);
}

function updateBox(color) {
    if(boxCounts[color] >= BOX_CAPACITY) return; // Box already full

    boxCounts[color]++;
    playSound('fill');
    
    const box = $('box' + color.charAt(0).toUpperCase() + color.slice(1));
    const slots = box.querySelectorAll('.screw-slot');
    const fill = box.querySelector('.bg-fill');
    
    // Fill one slot
    if(boxCounts[color] <= 2) {
        slots[boxCounts[color] - 1].textContent = '🔩';
        slots[boxCounts[color] - 1].style.color = '#FFF';
        slots[boxCounts[color] - 1].style.background = 'rgba(0,0,0,0.2)';
    }
    
    // Update fill bar
    fill.style.height = (boxCounts[color] / BOX_CAPACITY * 100) + '%';

    // Check if box is full
    if(boxCounts[color] === BOX_CAPACITY) {
        box.classList.add('filled');
        score += 10; // Bonus for filling box
        scoreEl.textContent = score;
        playSound('powerup'); // Success sound
        
        // Reset box after short delay
        setTimeout(() => {
            boxCounts[color] = 0;
            box.classList.remove('filled');
            slots.forEach(s => {
                s.textContent = '0';
                s.style.color = '#999';
                s.style.background = 'rgba(0,0,0,0.1)';
            });
            fill.style.height = '0%';
        }, 1000);
    }
}

function activatePowerup(type) {
    playSound('powerup');
    if(type === 'magnet') {
        activePowerups.magnet = 8000;
        setTimeout(() => activePowerups.magnet = 0, 8000);
    }
}

function startGame() {
    score = 0; gameSpeed = 1; currentLane = 1; isRunning = true;
    activePowerups = { magnet: 0 };
    boxCounts = { red: 0, green: 0, blue: 0 };
    
    // Reset UI
    scoreEl.textContent = '0';
    player.style.left = '50%';
    document.querySelectorAll('.obstacle, .collectible-screw, .powerup').forEach(el => el.remove());
    obstacles = []; items = [];
    
    COLORS.forEach(c => {
        const box = $('box' + c.charAt(0).toUpperCase() + c.slice(1));
        box.classList.remove('filled');
        box.querySelector('.bg-fill').style.height = '0%';
        box.querySelectorAll('.screw-slot').forEach(s => {
            s.textContent = '0';
            s.style.color = '#999';
            s.style.background = 'rgba(0,0,0,0.1)';
        });
    });

    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    
    lastTime = performance.now();
    lastSpawn = performance.now();
    
    scoreTimer = setInterval(() => {
        if(isRunning) { score++; scoreEl.textContent = score; }
    }, 1000);

    requestAnimationFrame(gameLoop);
}

function gameOver() {
    isRunning = false;
    clearInterval(scoreTimer);
    playSound('hit');
    
    flash.style.opacity = '0.5';
    setTimeout(() => flash.style.opacity = '0', 200);
    
    if(score > best) {
        best = score;
        localStorage.setItem('screwRunnerBest', best);
        bestEl.textContent = best;
    }
    
    $('finalScore').textContent = score;
    
    showInterstitialAd(() => {
        gameOverScreen.classList.remove('hidden');
    });
}

function showInterstitialAd(callback) {
    adScreen.classList.remove('hidden');
    let skipped = false;
    const skipBtn = $('btnSkipAd');
    skipBtn.style.display = 'none';
    setTimeout(() => { skipBtn.style.display = 'block'; }, 2000);

    const skipAction = () => {
        if(skipped) return;
        skipped = true;
        adScreen.classList.add('hidden');
        skipBtn.removeEventListener('click', skipAction);
        if(callback) callback();
    };
    skipBtn.addEventListener('click', skipAction);
}

$('btnRevive').addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    adScreen.classList.remove('hidden');
    setTimeout(() => {
        adScreen.classList.add('hidden');
        isRunning = true;
        obstacles.forEach(o => o.remove()); obstacles = [];
        activatePowerup('magnet'); // Give magnet instead of shield
        scoreTimer = setInterval(() => { if(isRunning) { score++; scoreEl.textContent = score; } }, 1000);
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }, 3000);
});

$('puMagnet').addEventListener('click', () => {
    if(!isRunning) return;
    activatePowerup('magnet');
});

$('btnStart').addEventListener('click', startGame);
$('btnRestart').addEventListener('click', startGame);
$('btnHome').addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    document.querySelectorAll('.obstacle, .collectible-screw, .powerup').forEach(el => el.remove());
    obstacles = []; items = [];
});

})();
</script>
</body>
</html>
