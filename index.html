<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eee3c5">
<title>Crown Match 3D</title>
<style>
:root{--cream:#eee3c5;--ink:#51432d;--purple:#8750d4;--blue:#426be9;--pink:#e64b68;--brown:#956d5b;--orange:#ef8b35;--yellow:#f2c83c;--green:#a9e783}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);touch-action:manipulation}
#game{height:100dvh;min-height:560px;max-width:520px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#fff4d9 0,#eee3c5 67%)}
.top{height:108px;padding:18px 16px 0;display:grid;grid-template-columns:42px 1fr 70px 70px;align-items:center;gap:8px}
.pause{font-size:28px;border:0;background:none;color:#665d4c;font-weight:900}
.level{text-align:center;font-weight:1000;font-size:23px;color:white;-webkit-text-stroke:1px #51432d;text-shadow:2px 3px 0 #75654a,0 0 2px #fff;letter-spacing:.5px}
.topIcon{font-size:35px;text-align:center;filter:drop-shadow(0 3px 1px #9c8250)}
.star{width:62px;height:62px;position:relative;display:grid;place-items:center;font-size:16px;font-weight:900;color:white;text-shadow:1px 2px #684b27;background:#f0bb39;clip-path:polygon(50% 0,62% 31%,96% 35%,72% 59%,79% 95%,50% 77%,20% 95%,27% 59%,3% 35%,38% 31%);filter:drop-shadow(0 3px 1px #927b4f)}
.bays{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:2px 14px 0;height:144px}
.bay{height:132px;border-radius:27px;background:linear-gradient(145deg,#fff 5%,#e4e5e9 80%);border:5px solid var(--purple);box-shadow:0 6px 0 #58279a, inset 0 2px 3px #fff;position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:17px}
.bay.blue{border-color:#5275f4;box-shadow:0 6px 0 #2946b4,inset 0 2px 3px #fff}
.bay.add{background:#f8d44e;border:2px solid #c59b1d;box-shadow:0 5px 0 #a27b16;color:#8c6a17;align-items:center;padding:0;font-size:58px;font-weight:300;border-radius:21px}
.bay .orb{width:45px;height:45px;position:absolute;top:17px}
.bay .dots{position:absolute;bottom:12px;display:flex;gap:24px}
.dot{width:34px;height:34px;border-radius:50%;background:#9da6b4;border:3px solid #dce0e7;box-shadow:inset 0 2px 3px #657080}
.ad{position:absolute;bottom:7px;right:3px;font-size:12px;font-weight:900;background:#43b96d;color:#fff;border-radius:10px;padding:1px 6px;border:2px solid #d9f5df}
.orb{border-radius:50%;display:grid;place-items:center;color:#573b2d;font-size:26px;font-weight:1000;text-shadow:0 1px 1px #fff8;background:radial-gradient(circle at 32% 25%,#fff8 0 8%,transparent 24%),radial-gradient(circle at 35% 28%,var(--c) 0 50%,var(--d) 100%);box-shadow:inset 0 -4px 0 #0002,0 3px 3px #66543b66;border:1px solid #0002}
.orb:after{content:"✦";transform:translateY(-1px);text-shadow:0 1px 1px #fff6}
.queue{height:55px;display:flex;justify-content:center;align-items:center;gap:11px;position:relative}
.queue .dot{width:31px;height:31px}
.boost{position:absolute;right:22px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#9d6b2d,#60320b 68%,#321900);border:4px solid #9c7b4a;box-shadow:0 4px 2px #6d5738;color:white;font-size:27px}
.boost span{position:absolute;right:-7px;bottom:-9px;font-size:25px;font-weight:900;text-shadow:2px 2px #4b321a}
.playfield{position:absolute;top:310px;bottom:190px;width:100%;display:flex;align-items:center;justify-content:center}
.board{position:relative;width:100%;height:100%;max-height:520px}
.track{position:absolute;left:29%;right:29%;top:45%;height:18%;border-radius:30px;background:#cb80a6;border:7px solid #fff2;box-shadow:0 5px 0 #866a6e,0 9px 12px #76664b55}
.track:before{content:"";position:absolute;left:30%;right:30%;top:-42%;height:50%;background:#cb80a6;border:7px solid #fff2;border-bottom:0;border-radius:25px 25px 0 0}
.cloud{position:absolute;left:3%;right:3%;top:22%;height:62%;background:#aaa99d;border:5px solid #858579;border-radius:42% 35% 37% 42%;opacity:.75;filter:drop-shadow(0 4px 0 #6d6b61)}
.arrow{position:absolute;bottom:0;width:23%;height:30%;background:#aaa99d;border:6px solid #888579;border-radius:32px;opacity:.85}
.arrow:before{content:"";position:absolute;left:-28%;top:-34%;width:150%;height:65%;background:#aaa99d;border:6px solid #888579;clip-path:polygon(50% 0,100% 80%,75% 100%,25% 100%,0 80%);border-radius:20px}
.arrow.left{left:7%}.arrow.right{right:7%}
.crown{position:absolute;width:28%;height:37%;background:linear-gradient(145deg,var(--c1),var(--c2));border:6px solid #fff0;border-radius:18px 18px 30px 30px;clip-path:polygon(0 27%,23% 48%,39% 0,57% 40%,76% 0,100% 28%,91% 100%,9% 100%);filter:drop-shadow(0 5px 1px #62544a);display:flex;align-items:center;justify-content:center}
.crown:after{content:"";position:absolute;inset:5px;border:4px solid #fff8;border-radius:15px 15px 28px 28px;clip-path:polygon(0 27%,23% 48%,39% 0,57% 40%,76% 0,100% 28%,91% 100%,9% 100%);pointer-events:none}
.crown.p1{left:3%;top:45%;--c1:#a27be9;--c2:#6940b9;transform:rotate(-7deg)}
.crown.p2{left:19%;top:22%;--c1:#e78bb5;--c2:#b35b91;transform:rotate(5deg)}
.crown.p3{left:34%;top:14%;--c1:#a18ae8;--c2:#6b50c1;transform:rotate(-2deg);z-index:3}
.crown.p4{left:49%;top:15%;--c1:#e5b09a;--c2:#b77d68;transform:rotate(5deg);z-index:2}
.crown.p5{right:3%;top:44%;--c1:#e6b49c;--c2:#b9826c;transform:rotate(7deg)}
.crown .gem{position:absolute;width:35px;height:35px;z-index:4}
.crown .g1{left:12%;top:24%}.crown .g2{right:13%;top:42%}.crown .g3{left:40%;bottom:10%}
.crown .socket{position:absolute;width:28px;height:28px;border:2px solid #fff9;border-radius:50%;z-index:4}
.crown .s1{left:12%;bottom:10%}.crown .s2{right:12%;bottom:10%}
.crown.selected{outline:4px solid #fff;filter:drop-shadow(0 0 9px #fff)}
.crown:active{transform:scale(.97)}
.gem{width:43px;height:43px;cursor:pointer;z-index:5}
.gem.small{width:34px;height:34px}
.greenTray{position:absolute;z-index:8;top:0;left:30%;width:40%;height:88px;border:6px solid #fff9;border-radius:29px;background:#aee986;box-shadow:0 5px 0 #83bc65;display:flex;align-items:center;justify-content:space-evenly}
.greenTray .slot{width:28px;height:28px;border:2px solid #fff9;border-radius:50%;display:grid;place-items:center}
.greenTray .slot .orb{width:34px;height:34px}
.tools{position:absolute;bottom:18px;left:5%;right:5%;height:94px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tool{background:#f8d34e;border:2px solid #c49b1d;border-radius:19px;box-shadow:0 6px 0 #a77f17;display:grid;place-items:center;position:relative;font-size:45px}
.tool b{position:absolute;right:-7px;top:-12px;background:white;border:3px solid #777;border-radius:13px;padding:0 8px;font-size:22px;color:#333}
.tool:active,.tool.active{transform:translateY(4px);box-shadow:0 2px 0 #a77f17}
.hint{position:absolute;bottom:125px;left:0;right:0;text-align:center;font-size:12px;color:#857657}
.toast{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);background:#49331d;color:white;padding:12px 20px;border-radius:20px;z-index:30;display:none;box-shadow:0 4px 12px #0004}
.overlay{position:absolute;inset:0;background:#342a1d99;z-index:40;display:none;align-items:center;justify-content:center;padding:25px}
.panel{width:100%;background:#fff2d7;border:5px solid #fff;border-radius:28px;padding:25px;text-align:center;box-shadow:0 8px 0 #90784d}
.panel h2{margin:0 0 10px;font-size:28px}.panel p{line-height:1.5}
.action{border:0;border-radius:16px;padding:13px 24px;background:linear-gradient(#ffdf62,#f2b72e);box-shadow:0 5px 0 #a87917;font-weight:900;font-size:17px;color:#594015;margin:8px}
@media(max-height:700px){.top{height:90px}.bays{height:120px}.bay{height:108px}.playfield{top:270px;bottom:155px}.tools{height:76px}.hint{bottom:103px}}
</style>
</head>
<body>
<div id="game">
 <header class="top">
  <button class="pause" id="pause" aria-label="रोकें">Ⅱ</button>
  <div class="level" id="level">LEVEL 132</div>
  <div class="topIcon">🛒</div>
  <div class="star">44%</div>
 </header>
 <section class="bays">
  <div class="bay"><div class="orb" style="--c:#bd6bf1;--d:#7a31bf"></div><div class="dots"><i class="dot"></i><i class="dot"></i></div></div>
  <div class="bay blue"><div class="orb" style="--c:#6d8cff;--d:#3554d4"></div><div class="dots"><i class="dot"></i><i class="dot"></i></div></div>
  <button class="bay add" id="addA">＋<span class="ad">AD</span></button>
  <button class="bay add" id="addB">＋<span class="ad">AD</span></button>
 </section>
 <div class="queue" id="queue"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><button class="boost" id="shuffle">✕<span>3</span></button></div>
 <main class="playfield">
  <div class="board">
   <div class="greenTray" id="tray"></div>
   <div class="cloud"></div><div class="track"></div>
   <div class="arrow left"></div><div class="arrow right"></div>
   <div class="crown p1" data-crown="0"><span class="socket s1"></span><span class="socket s2"></span><div class="orb gem g1" data-color="brown" style="--c:#b58a69;--d:#76503d"></div></div>
   <div class="crown p2" data-crown="1"><div class="orb gem g1" data-color="blue" style="--c:#6c91ff;--d:#3855d4"></div><div class="orb gem g2" data-color="brown" style="--c:#b58a69;--d:#76503d"></div></div>
   <div class="crown p3" data-crown="2"><div class="orb gem g1" data-color="blue" style="--c:#6c91ff;--d:#3855d4"></div><div class="orb gem g2" data-color="purple" style="--c:#ba65ed;--d:#7832bd"></div><div class="orb gem g3" data-color="orange" style="--c:#ffad50;--d:#c9671b"></div><span class="socket s1"></span></div>
   <div class="crown p4" data-crown="3"><div class="orb gem g1" data-color="purple" style="--c:#ba65ed;--d:#7832bd"></div><div class="orb gem g2" data-color="orange" style="--c:#ffad50;--d:#c9671b"></div></div>
   <div class="crown p5" data-crown="4"><div class="orb gem g1" data-color="purple" style="--c:#ba65ed;--d:#7832bd"></div><div class="orb gem g2" data-color="pink" style="--c:#ff6581;--d:#c52d4d"></div></div>
   <div class="orb gem" style="position:absolute;left:30%;top:61%;--c:#b58a69;--d:#76503d" data-color="brown"></div>
   <div class="orb gem" style="position:absolute;left:52%;top:61%;--c:#f8d34e;--d:#bd8b0b" data-color="yellow"></div>
   <div class="orb gem" style="position:absolute;left:64%;top:61%;--c:#a967e9;--d:#7034ba" data-color="purple"></div>
   <div class="orb gem" style="position:absolute;left:78%;top:61%;--c:#f8d34e;--d:#bd8b0b" data-color="yellow"></div>
  </div>
 </main>
 <div class="hint">रत्न चुनें और ऊपर खाली जगह में रखें • एक रंग के 3 रत्न मिलाएँ</div>
 <section class="tools">
  <button class="tool" data-tool="drill" title="ड्रिल">🛠️<b id="drillCount">2</b></button>
  <button class="tool" data-tool="hammer" title="हथौड़ा">🔨<b id="hammerCount">1</b></button>
  <button class="tool" data-tool="brush" title="ब्रश">🧹<b id="brushCount">1</b></button>
 </section>
 <div class="toast" id="toast"></div>
 <div class="overlay" id="overlay"><div class="panel"><h2 id="panelTitle">गेम रुका हुआ है</h2><p id="panelText">जब चाहें खेल जारी रखें।</p><button class="action" id="resume">जारी रखें</button><button class="action" id="restart">फिर से शुरू</button></div></div>
</div>
<script>
(()=> {
 const colors={purple:['#ba65ed','#7832bd'],blue:['#6c91ff','#3855d4'],pink:['#ff6581','#c52d4d'],brown:['#b58a69','#76503d'],orange:['#ffad50','#c9671b'],yellow:['#f8d34e','#bd8b0b']};
 const tray=document.getElementById('tray'),queue=document.getElementById('queue'),toast=document.getElementById('toast');
 let pieces=[],moves=0,level=132,selected=null,tool=null,counts={drill:2,hammer:1,brush:1},paused=false;
 const initial=[['brown'],['blue','brown'],['blue','purple','orange'],['purple','orange'],['purple','pink'],['brown','yellow','purple','yellow']];
 function makeOrb(color,small=false){let el=document.createElement('div');el.className='orb'+(small?' small':'');el.style.setProperty('--c',colors[color][0]);el.style.setProperty('--d',colors[color][1]);el.dataset.color=color;return el}
 function say(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>toast.style.display='none',1700)}
 function renderTray(){tray.innerHTML='';for(let i=0;i<5;i++){let slot=document.createElement('div');slot.className='slot';if(pieces[i])slot.appendChild(makeOrb(pieces[i],true));slot.addEventListener('click',()=>{if(selected)placeSelected(i)});tray.appendChild(slot)}queue.innerHTML='';for(let i=0;i<5;i++){let d=document.createElement('i');d.className='dot';if(pieces[i]){d.style.background=colors[pieces[i]][0];d.style.borderColor=colors[pieces[i]][1]}queue.appendChild(d)}let b=document.createElement('button');b.className='boost';b.id='shuffle';b.innerHTML='✕<span>3</span>';b.onclick=shuffle;queue.appendChild(b)}
 function init(){pieces=[];moves=0;selected=null;document.querySelectorAll('.board>.gem').forEach((g,i)=>{g.style.display='grid';g.dataset.used='0'});document.querySelectorAll('.crown .gem').forEach(g=>{g.style.display='grid';g.dataset.used='0'});renderTray();document.getElementById('level').textContent='LEVEL '+level}
 function getGems(){return [...document.querySelectorAll('.board .gem')].filter(g=>g.style.display!=='none')}
 function placeSelected(index){if(index<0||index>4)return;if(pieces[index]){say('यह जगह पहले से भरी है');return}if(pieces.length>=5){lose();return}pieces[index]=selected.dataset.color;selected.style.display='none';selected=null;renderTray();moves++;let c=pieces.filter(Boolean);let countsBy={};c.forEach(x=>countsBy[x]=(countsBy[x]||0)+1);let match=Object.keys(countsBy).find(k=>countsBy[k]>=3);if(match){pieces=pieces.filter(x=>x!==match);say('शानदार! 3 एक जैसे रत्न मिले');renderTray()}if(getGems().length===0){level++;document.getElementById('panelTitle').textContent='स्तर पूरा!';document.getElementById('panelText').textContent='बहुत बढ़िया! अगला स्तर खेलने के लिए फिर से शुरू दबाएँ।';openPanel()}else if(pieces.filter(Boolean).length===5)lose()}
 document.querySelectorAll('.board .gem').forEach(g=>g.addEventListener('click',()=>{if(paused||g.style.display==='none')return;if(tool){useTool(g);return}if(selected)selected.classList.remove('selected');selected=g;g.classList.add('selected');let empty=pieces.findIndex(x=>!x);if(empty<0){say('ऊपर की जगह खाली नहीं है');return}placeSelected(empty)}));
 function lose(){document.getElementById('panelTitle').textContent='जगह भर गई!';document.getElementById('panelText').textContent='ट्रे भर गई है। फिर से कोशिश करें और तीन एक जैसे रत्न मिलाएँ।';openPanel()}
 function openPanel(){paused=true;document.getElementById('overlay').style.display='flex'}
 function closePanel(){paused=false;document.getElementById('overlay').style.display='none'}
 document.getElementById('pause').onclick=()=>{document.getElementById('panelTitle').textContent='गेम रुका हुआ है';document.getElementById('panelText').textContent='खेल जारी रखें या स्तर फिर से शुरू करें।';openPanel()};
 document.getElementById('resume').onclick=closePanel;document.getElementById('restart').onclick=()=>{init();closePanel()};
 document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{let t=b.dataset.tool;if(counts[t]<=0){say('यह टूल अभी उपलब्ध नहीं है');return}tool=tool===t?null:t;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x.dataset.tool===tool));say(tool==='drill'?'ड्रिल: हटाने वाला रत्न चुनें':tool==='hammer'?'हथौड़ा: एक रत्न हटाएँ':'ब्रश: ट्रे खाली करें')});
 function useTool(g){if(!tool)return;let t=tool;counts[t]--;document.getElementById(t+'Count').textContent=counts[t];if(t==='brush'){pieces=[];renderTray();say('ट्रे साफ हो गई')}else{g.style.display='none';say(t==='drill'?'रत्न हटाया गया':'हथौड़े से रत्न हटाया गया')}tool=null;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'))}
 function shuffle(){if(!pieces.length){say('ट्रे पहले से खाली है');return}pieces=[];renderTray();say('ट्रे के रत्न हटा दिए गए')}
 document.getElementById('addA').onclick=()=>say('विज्ञापन सुविधा डेमो में उपलब्ध नहीं है');document.getElementById('addB').onclick=()=>say('विज्ञापन सुविधा डेमो में उपलब्ध नहीं है');
 init();
})();
</script>
</body></html>
