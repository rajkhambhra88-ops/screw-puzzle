<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Unscrew Nuts 3D - Color Box Edition</title>
<style>
:root {
  --bg-dark: #10141e;
  --bg-panel: #1a2233;
  --bg-card: #253046;
  --accent-gold: #ffbe0b;
  --accent-green: #06d6a0;
  --accent-blue: #118ab2;
  --accent-red: #ef476f;
  --text-main: #f8f9fa;
  --text-muted: #94a3b8;
}
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  margin: 0;
  padding: 0;
}
body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}
#game-container {
  width: 100%;
  max-width: 480px;
  height: 100%;
  max-height: 960px;
  background: radial-gradient(circle at 50% 25%, #1f293d 0%, #0b0f17 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
}
/* Header */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: rgba(16, 20, 30, 0.85);
  backdrop-filter: blur(8px);
  z-index: 30;
}
.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.coin-badge {
  background: #253046;
  border: 1px solid #3e4f70;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 14px;
  color: var(--accent-gold);
  display: flex;
  align-items: center;
  gap: 6px;
}
.level-badge {
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.5px;
}
.btn-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #253046;
  border: 1px solid #3e4f70;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.1s;
}
.btn-icon:active { transform: scale(0.92); }

/* COLOR MATCH TARGET BOX (TOP) */
.target-box-area {
  padding: 10px 16px 4px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 25;
}
.target-box-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.active-color-box {
  width: 220px;
  height: 70px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  padding: 0 10px;
  position: relative;
  box-shadow: 0 8px 18px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -4px 8px rgba(0,0,0,0.4);
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
  transform-style: preserve-3d;
}
.active-color-box.disappear {
  transform: scale(0.1) rotate(20deg) translateY(-80px);
  opacity: 0;
}
.active-color-box.appear {
  animation: popIn 0.35s ease forwards;
}
@keyframes popIn {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* Box Colors */
.box-gold { background: linear-gradient(180deg, #f59e0b, #b45309); border: 3px solid #fde047; }
.box-red { background: linear-gradient(180deg, #ef4444, #991b1b); border: 3px solid #fca5a5; }
.box-blue { background: linear-gradient(180deg, #3b82f6, #1e40af); border: 3px solid #93c5fd; }
.box-green { background: linear-gradient(180deg, #10b981, #065f46); border: 3px solid #6ee7b7; }
.box-purple { background: linear-gradient(180deg, #a855f7, #6b21a8); border: 3px solid #d8b4fe; }
.box-silver { background: linear-gradient(180deg, #94a3b8, #475569); border: 3px solid #e2e8f0; }

.box-hole {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle, #080b11 60%, rgba(0,0,0,0.5) 100%);
  border: 2px dashed rgba(255,255,255,0.3);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 3px 6px #000;
}

/* BUFFER TRAY (HOLDING MISMATCH SCREWS) */
.tray-container {
  background: rgba(22, 28, 40, 0.85);
  border: 1px solid #313e54;
  border-radius: 12px;
  margin: 6px 16px 2px 16px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
}
.tray-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
}
.tray-slots {
  display: flex;
  gap: 8px;
}
.tray-slot {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #0d121b;
  border: 1.5px dashed #475569;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 2px 4px #000;
}

/* Game Stage & 3D Elements */
#stage {
  flex: 1;
  width: 100%;
  position: relative;
  overflow: hidden;
  perspective: 900px;
}
.interactive-board {
  position: absolute;
  border-radius: 12px;
  transform-style: preserve-3d;
  box-shadow: 0 10px 22px rgba(0,0,0,0.55), inset 0 0 10px rgba(255,255,255,0.1);
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s;
  pointer-events: none;
}
.board-wood {
  background: repeating-linear-gradient(45deg, #8b4513, #8b4513 14px, #78380c 14px, #78380c 28px);
  border: 3px solid #5a2808;
}
.board-metal {
  background: linear-gradient(135deg, #9ca3af 0%, #475569 50%, #9ca3af 100%);
  border: 3px solid #334155;
}
.board-glass {
  background: rgba(147, 197, 253, 0.25);
  backdrop-filter: blur(4px);
  border: 2px solid rgba(255, 255, 255, 0.6);
}
.board-stone {
  background: #52525b;
  border: 3px solid #27272a;
}

/* Screws & Caps */
.screw {
  width: 42px;
  height: 42px;
  position: absolute;
  border-radius: 50%;
  cursor: pointer;
  z-index: 25;
  transform: translate(-50%, -50%);
  transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.screw-cap {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 -3px 4px rgba(0,0,0,0.4), 0 5px 10px rgba(0,0,0,0.55);
  position: relative;
}
.screw-cap::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 5px;
  background: rgba(0,0,0,0.55);
  border-radius: 2px;
  box-shadow: 0 1px 1px rgba(255,255,255,0.25);
}
.screw-cap::before {
  content: '';
  position: absolute;
  height: 20px;
  width: 5px;
  background: rgba(0,0,0,0.55);
  border-radius: 2px;
  box-shadow: 0 1px 1px rgba(255,255,255,0.25);
}
.screw-gold { background: radial-gradient(circle, #fde047 30%, #ca8a04 90%); }
.screw-red { background: radial-gradient(circle, #f87171 30%, #b91c1c 90%); }
.screw-blue { background: radial-gradient(circle, #60a5fa 30%, #1d4ed8 90%); }
.screw-green { background: radial-gradient(circle, #4ade80 30%, #15803d 90%); }
.screw-purple { background: radial-gradient(circle, #c084fc 30%, #7e22ce 90%); }
.screw-silver { background: radial-gradient(circle, #e2e8f0 30%, #64748b 90%); }

.hole {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle, #05070a 65%, #2a3447 100%);
  position: absolute;
  transform: translate(-50%, -50%);
  box-shadow: inset 0 3px 5px #000;
  border: 1px solid #334155;
  z-index: 10;
}

/* Boosters */
.boosters-bar {
  display: flex;
  justify-content: space-around;
  padding: 8px 16px;
  background: rgba(16, 20, 30, 0.95);
  border-top: 1px solid #232c3f;
  z-index: 30;
}
.booster-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text-main);
  cursor: pointer;
  position: relative;
}
.booster-icon-wrap {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--bg-card);
  border: 1px solid #3d4a63;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}
.booster-count {
  position: absolute;
  top: -3px;
  right: -2px;
  background: var(--accent-gold);
  color: #000;
  font-size: 10px;
  font-weight: 800;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-dark);
}
.booster-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
}

/* Modals */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(8, 11, 16, 0.85);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  padding: 20px;
}
.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}
.modal-box {
  width: 100%;
  max-width: 320px;
  background: linear-gradient(145deg, #20283a, #141924);
  border: 1px solid #37435b;
  border-radius: 20px;
  padding: 24px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
.modal-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.modal-body { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
.btn-primary {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ffbe0b, #f59e0b);
  border: none;
  color: #000;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  margin-bottom: 10px;
}
.btn-secondary {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: #253046;
  border: 1px solid #384661;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
/* Level Grid */
.level-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  max-height: 280px;
  overflow-y: auto;
  margin-bottom: 16px;
}
.level-node {
  aspect-ratio: 1;
  background: #253046;
  border: 1px solid #384661;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.level-node.locked { opacity: 0.35; cursor: not-allowed; }
.level-node.completed { border-color: var(--accent-gold); color: var(--accent-gold); }

#fx-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 40;
}
</style>
</head>
<body>

<div id="game-container">
  <!-- Top Bar -->
  <header class="header-bar">
    <div class="header-left">
      <div class="coin-badge">🪙 <span id="coin-counter">0</span></div>
    </div>
    <div class="level-badge" id="level-title">Level 1</div>
    <div class="header-right">
      <button class="btn-icon" id="btn-levels">☰</button>
      <button class="btn-icon" id="btn-sound">🔊</button>
    </div>
  </header>

  <!-- OPEN COLOR BOX AREA (MATCH 3 SCREWS) -->
  <div class="target-box-area">
    <div class="target-box-title" id="box-status-text">FILL THE BOX (3 HOLES)</div>
    <div class="active-color-box box-gold" id="active-box">
      <div class="box-hole" id="box-hole-0"></div>
      <div class="box-hole" id="box-hole-1"></div>
      <div class="box-hole" id="box-hole-2"></div>

  <!-- BUFFER TRAY (HOLD MISMATCHED SCREWS) -->

  <!-- 3D PUZZLE STAGE -->
  <main id="stage">
    <canvas id="fx-canvas"></canvas>
  </main>

  <!-- BOOSTERS -->
  <footer class="boosters-bar">
    <button class="booster-btn" id="btn-boost-undo">
      <div class="booster-icon-wrap">↺<div class="booster-count" id="count-undo">3</div></div>
      <span class="booster-label">Undo</span>
    </button>
    <button class="booster-btn" id="btn-boost-tray">
      <div class="booster-icon-wrap">➕<div class="booster-count">+1</div></div>
      <span class="booster-label">Extra Slot</span>
    </button>
    <button class="booster-btn" id="btn-boost-hammer">
      <div class="booster-icon-wrap">🔨<div class="booster-count" id="count-hammer">1</div></div>
      <span class="booster-label">Hammer</span>
    </button>
  </footer>

  <!-- VICTORY MODAL -->
  <div class="modal-overlay" id="modal-victory">
    <div class="modal-box">
      <div class="modal-title" style="color:var(--accent-gold)">🎉 LEVEL CLEARED!</div>
      <div class="modal-body">All boxes filled & boards released cleanly!</div>
      <div style="font-size:26px; margin-bottom:16px;">⭐⭐⭐</div>
      <button class="btn-primary" id="btn-next-lvl">NEXT LEVEL</button>
    </div>
  </div>

  <!-- GAMEOVER MODAL -->
  <div class="modal-overlay" id="modal-gameover">
    <div class="modal-box">
      <div class="modal-title" style="color:var(--accent-red)">⚠️ BUFFER FULL</div>
      <div class="modal-body">Buffer tray me jagah nahi bachi! Extra slot unlock karein ya retry karein.</div>
      <button class="btn-primary" id="btn-ad-free-tray">📺 UNLOCK SLOT (+1)</button>
      <button class="btn-secondary" id="btn-retry-lvl">TRY AGAIN</button>
    </div>
  </div>

  <!-- LEVEL SELECT MODAL -->
  <div class="modal-overlay" id="modal-levels">
    <div class="modal-box">
      <div class="modal-title">Select Level</div>
      <div class="level-grid" id="level-grid-container"></div>
      <button class="btn-secondary" id="btn-close-levels">CLOSE</button>
    </div>
  </div>
</div>

<script>
/* AUDIO ENGINE */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
  }
  playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.2) {
    if (this.muted) return;
    this.init();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) {}
  }
  unscrew() {
    this.playTone(380, 'triangle', 0.12, 0.25);
    setTimeout(() => this.playTone(600, 'sine', 0.1, 0.2), 50);
  }
  boxComplete() {
    [440, 554, 659, 880].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.18, 0.25), i * 80);
    });
  }
  boardFall() { this.playTone(130, 'triangle', 0.4, 0.35); }
  win() {
    [392, 523, 659, 784].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'triangle', 0.22, 0.3), i * 110);
    });
  }
  lose() {
    [320, 260, 200].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.2, 0.25), i * 100);
    });
  }
}

/* CONFETTI FX */
class FXEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particles = [];
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.loop();
  }
  resize() {
    this.canvas.width = this.canvas.parentElement.clientWidth;
    this.canvas.height = this.canvas.parentElement.clientHeight;
  }
  spawn(x, y, count = 25) {
    const colors = ['#ffbe0b', '#06d6a0', '#118ab2', '#ef476f', '#ffffff'];
    for(let i = 0; i < count; i++) {
      this.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8 - 3,
        size: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1,
        decay: Math.random() * 0.02 + 0.02,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 10
      });
    }
  }
  loop() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25;
      p.rot += p.vRot;
      p.life -= p.decay;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
        continue;
      }
      this.ctx.save();
      this.ctx.translate(p.x, p.y);
      this.ctx.rotate((p.rot * Math.PI) / 180);
      this.ctx.fillStyle = p.color;
      this.ctx.globalAlpha = p.life;
      this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      this.ctx.restore();
    }
    requestAnimationFrame(() => this.loop());
  }
}

/* 30 BALANCED PROCEDURAL LEVELS */
function buildLevelDatabase() {
  const levels = [];
  const materials = ['wood', 'metal', 'glass', 'stone'];
  const colors = ['gold', 'red', 'blue', 'green', 'purple', 'silver'];

  for (let i = 1; i <= 30; i++) {
    // 3 ke multiple me screws rakhein taaki box clean complete hon
    const activeColorCount = Math.min(2 + Math.floor(i / 8), 5);
    const chosenColors = colors.slice(0, activeColorCount);
    const boards = [];
    const screws = [];

    const numBoards = Math.min(2 + Math.floor(i / 6), 5);
    for (let b = 0; b < numBoards; b++) {
      const isHorizontal = (b % 2 === 0);
      const w = isHorizontal ? 200 : 56;
      const h = isHorizontal ? 56 : 180;
      const left = 60 + (b * 26 + i * 5) % 150;
      const top = 50 + (b * 40 + i * 9) % 200;
      const boardId = `b_${i}_${b}`;
      boards.push({ id: boardId, x: left, y: top, w, h, mat: materials[b % materials.length] });

      const screwsPerBoard = (i < 4) ? 3 : 3; // Har board par 3 screws for box match
      for (let s = 0; s < screwsPerBoard; s++) {
        const sx = left + (isHorizontal ? 30 + s * ((w - 60) / 2) : w / 2);
        const sy = top + (isHorizontal ? h / 2 : 30 + s * ((h - 60) / 2));
        screws.push({
          id: `s_${i}_${b}_${s}`,
          boardId: boardId,
          x: sx,
          y: sy,
          color: chosenColors[(b + s) % chosenColors.length]
        });
      }
    }

    levels.push({
      levelNumber: i,
      bufferTraySize: (i < 5) ? 3 : 4,
      boards,
      screws
    });
  }
  return levels;
}

/* MAIN GAME CONTROLLER */
class GameEngine {
  constructor() {
    this.audio = new SoundEngine();
    this.fx = new FXEngine(document.getElementById('fx-canvas'));
    this.levelDb = buildLevelDatabase();

    this.coins = parseInt(localStorage.getItem('un_coins') || '100', 10);
    this.unlockedLevel = parseInt(localStorage.getItem('un_level') || '1', 10);
    this.currentLevelIndex = 0;
    this.inventory = {
      undo: parseInt(localStorage.getItem('un_undo') || '3', 10),
      hammer: parseInt(localStorage.getItem('un_hammer') || '1', 10)
    };

    // Box and Buffer States
    this.activeBoxColor = 'gold';
    this.boxSlots = [null, null, null]; // Exactly 3 holes
    this.bufferTray = [];
    this.bufferTrayMax = 3;
    this.hammerMode = false;
    this.moveHistory = [];

    this.initUI();
    this.loadLevel(this.unlockedLevel - 1);
  }

  save() {
    localStorage.setItem('un_coins', this.coins);
    localStorage.setItem('un_level', this.unlockedLevel);
    localStorage.setItem('un_undo', this.inventory.undo);
    localStorage.setItem('un_hammer', this.inventory.hammer);
    document.getElementById('coin-counter').innerText = this.coins;
    document.getElementById('count-undo').innerText = this.inventory.undo;
    document.getElementById('count-hammer').innerText = this.inventory.hammer;
  }

  initUI() {
    this.save();
    document.getElementById('btn-sound').onclick = () => {
      this.audio.muted = !this.audio.muted;
      document.getElementById('btn-sound').innerText = this.audio.muted ? '🔇' : '🔊';
    };
    document.getElementById('btn-levels').onclick = () => this.showLevelModal();
    document.getElementById('btn-close-levels').onclick = () => document.getElementById('modal-levels').classList.remove('active');
    document.getElementById('btn-next-lvl').onclick = () => {
      document.getElementById('modal-victory').classList.remove('active');
      this.loadLevel(this.currentLevelIndex + 1);
    };
    document.getElementById('btn-retry-lvl').onclick = () => {
      document.getElementById('modal-gameover').classList.remove('active');
      this.loadLevel(this.currentLevelIndex);
    };
    document.getElementById('btn-ad-free-tray').onclick = () => {
      this.bufferTrayMax++;
      this.renderBufferTray();
      document.getElementById('modal-gameover').classList.remove('active');
    };
    document.getElementById('btn-boost-undo').onclick = () => this.useUndo();
    document.getElementById('btn-boost-tray').onclick = () => {
      this.bufferTrayMax++;
      this.renderBufferTray();
    };
    document.getElementById('btn-boost-hammer').onclick = () => {
      if (this.inventory.hammer <= 0) return;
      this.hammerMode = !this.hammerMode;
      document.getElementById('btn-boost-hammer').style.filter = this.hammerMode ? 'drop-shadow(0 0 8px red)' : 'none';
    };
  }

  loadLevel(index) {
    if (index >= this.levelDb.length) index = 0;
    this.currentLevelIndex = index;
    const lvl = this.levelDb[index];

    document.getElementById('level-title').innerText = `Level ${lvl.levelNumber}`;
    this.bufferTrayMax = lvl.bufferTraySize;
    this.bufferTray = [];
    this.boxSlots = [null, null, null];
    this.moveHistory = [];
    this.hammerMode = false;

    this.boards = JSON.parse(JSON.stringify(lvl.boards));
    this.screws = JSON.parse(JSON.stringify(lvl.screws));

    // Choose first active color from existing screws
    this.setupNextColorBox();
    this.renderBufferTray();
    this.renderStage();
  }

  // Naya matching color box set karna jo hamare bache huye screws me ho
  setupNextColorBox() {
    const availableColors = [...new Set(this.screws.map(s => s.color))];
    if (availableColors.length > 0) {
      this.activeBoxColor = availableColors[0];
    } else {
      // Agar board par screws khatam ho gaye lekin buffer me hain
      const bufColors = [...new Set(this.bufferTray.filter(Boolean).map(s => s.color))];
      if (bufColors.length > 0) this.activeBoxColor = bufColors[0];
    }

    const boxEl = document.getElementById('active-box');
    boxEl.className = `active-color-box box-${this.activeBoxColor} appear`;
    this.boxSlots = [null, null, null];
    this.renderBoxHoles();

    // Check karein kya buffer tray me is color ke screw pehle se baithe hain
    this.flushBufferToBox();
  }

  renderBoxHoles() {
    for (let i = 0; i < 3; i++) {
      const hole = document.getElementById(`box-hole-${i}`);
      hole.innerHTML = '';
      if (this.boxSlots[i]) {
        const cap = document.createElement('div');
        cap.className = `screw-cap screw-${this.boxSlots[i].color}`;
        hole.appendChild(cap);
      }
    }
  }

  renderBufferTray() {
    const row = document.getElementById('tray-slot-row');
    row.innerHTML = '';
    for (let i = 0; i < this.bufferTrayMax; i++) {
      const slot = document.createElement('div');
      slot.className = 'tray-slot';
      if (this.bufferTray[i]) {
        const cap = document.createElement('div');
        cap.className = `screw-cap screw-${this.bufferTray[i].color}`;
        slot.appendChild(cap);
      }
      row.appendChild(slot);
    }
  }

  renderStage() {
    const stage = document.getElementById('stage');
    Array.from(stage.children).forEach(child => {
      if (child.id !== 'fx-canvas') stage.removeChild(child);
    });

    // Boards
    this.boards.forEach(b => {
      const el = document.createElement('div');
      el.id = b.id;
      el.className = `interactive-board board-${b.mat}`;
      el.style.width = `${b.w}px`;
      el.style.height = `${b.h}px`;
      el.style.left = `${b.x}px`;
      el.style.top = `${b.y}px`;
      stage.appendChild(el);
    });

    // Holes & Screws
    this.screws.forEach(s => {
      const hole = document.createElement('div');
      hole.className = 'hole';
      hole.style.left = `${s.x}px`;
      hole.style.top = `${s.y}px`;
      stage.appendChild(hole);

      const el = document.createElement('div');
      el.id = s.id;
      el.className = 'screw';
      el.style.left = `${s.x}px`;
      el.style.top = `${s.y}px`;
      const cap = document.createElement('div');
      cap.className = `screw-cap screw-${s.color}`;
      el.appendChild(cap);

      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        this.onScrewTap(s);
      });
      stage.appendChild(el);
    });
  }

  onScrewTap(screw) {
    if (this.hammerMode) {
      this.useHammerOnScrew(screw);
      return;
    }

    const screwEl = document.getElementById(screw.id);
    if (!screwEl) return;

    // Check: Kya yeh screw current open box ke color se match hota hai?
    const isMatchingBox = (screw.color === this.activeBoxColor);
    const boxEmptyIndex = this.boxSlots.findIndex(s => s === null);

    if (isMatchingBox && boxEmptyIndex !== -1) {
      // MATCH HO GAYA -> seedha Box ke hole me jayega
      this.audio.unscrew();
      this.animateScrewRemoval(screwEl);
      this.boxSlots[boxEmptyIndex] = screw;
      this.screws = this.screws.filter(s => s.id !== screw.id);
      this.renderBoxHoles();

      // Check karein kya box bhar gaya (3 holes full)?
      if (this.boxSlots.every(s => s !== null)) {
        this.onBoxFilled();
      }
    } else {
      // MISMATCH -> Buffer tray me jayega
      const emptyBufferSlot = this.findEmptyBufferSlot();
      if (emptyBufferSlot === -1) {
        // Buffer tray full -> Game Over
        this.audio.lose();
        document.getElementById('modal-gameover').classList.add('active');
        return;
      }
      this.audio.unscrew();
      this.animateScrewRemoval(screwEl);
      this.bufferTray[emptyBufferSlot] = screw;
      this.screws = this.screws.filter(s => s.id !== screw.id);
      this.renderBufferTray();
    }

    // Check falling boards & Win condition
    this.checkBoardPhysics();
  }

  findEmptyBufferSlot() {
    for (let i = 0; i < this.bufferTrayMax; i++) {
      if (!this.bufferTray[i]) return i;
    }
    return -1;
  }

  animateScrewRemoval(el) {
    el.style.transform = 'translate(-50%, -50%) scale(1.4) rotate(360deg)';
    el.style.opacity = '0';
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
  }

  // Jab 3 holes baith jayein -> Box gayab aur doosre color ka box aana
  onBoxFilled() {
    this.audio.boxComplete();
    const boxEl = document.getElementById('active-box');
    this.fx.spawn(window.innerWidth / 2, 90, 30);

    // Box gayab hone ka animation
    setTimeout(() => {
      boxEl.classList.add('disappear');
      setTimeout(() => {
        this.coins += 20;
        this.save();
        // Agla box lana
        this.setupNextColorBox();
      }, 350);
    }, 200);
  }

  // Agar buffer me match hone wale screws hain toh wo box me chale jayein
  flushBufferToBox() {
    let moved = false;
    for (let i = 0; i < this.bufferTray.length; i++) {
      const sc = this.bufferTray[i];
      if (sc && sc.color === this.activeBoxColor) {
        const boxEmptyIndex = this.boxSlots.findIndex(s => s === null);
        if (boxEmptyIndex !== -1) {
          this.boxSlots[boxEmptyIndex] = sc;
          this.bufferTray[i] = null;
          moved = true;
        }
      }
    }
    if (moved) {
      this.renderBufferTray();
      this.renderBoxHoles();
      if (this.boxSlots.every(s => s !== null)) {
        this.onBoxFilled();
      }
    }
  }

  checkBoardPhysics() {
    this.boards.forEach(b => {
      if (b.fallen) return;
      const attached = this.screws.filter(s => s.boardId === b.id);
      if (attached.length === 0) {
        b.fallen = true;
        this.dropBoard(b);
      }
    });

    // Win condition check
    const remainingBoards = this.boards.filter(b => !b.fallen);
    if (remainingBoards.length === 0) {
      setTimeout(() => {
        this.audio.win();
        this.fx.spawn(window.innerWidth / 2, window.innerHeight / 2, 50);
        this.coins += 50;
        if (this.unlockedLevel <= this.currentLevelIndex + 1) {
          this.unlockedLevel = Math.min(this.currentLevelIndex + 2, this.levelDb.length);
        }
        this.save();
        document.getElementById('modal-victory').classList.add('active');
      }, 600);
    }
  }

  dropBoard(b) {
    const el = document.getElementById(b.id);
    if (!el) return;
    this.audio.boardFall();
    const rot = (Math.random() - 0.5) * 60;
    el.style.transform = `translate3d(0, 500px, 80px) rotate(${rot}deg)`;
    el.style.opacity = '0';
    this.fx.spawn(b.x + b.w / 2, b.y + b.h / 2, 15);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 550);
  }

  useHammerOnScrew(screw) {
    this.inventory.hammer--;
    this.hammerMode = false;
    document.getElementById('btn-boost-hammer').style.filter = 'none';
    this.save();
    const el = document.getElementById(screw.id);
    if (el) el.remove();
    this.screws = this.screws.filter(s => s.id !== screw.id);
    this.audio.boardFall();
    this.fx.spawn(screw.x, screw.y, 20);
    this.checkBoardPhysics();
  }

  useUndo() {
    if (this.inventory.undo <= 0) return;
    // Undo buffer last item if available
    const lastIdx = this.bufferTray.map(Boolean).lastIndexOf(true);
    if (lastIdx !== -1) {
      this.inventory.undo--;
      const sc = this.bufferTray[lastIdx];
      this.bufferTray[lastIdx] = null;
      this.screws.push(sc);
      this.save();
      this.renderBufferTray();
      this.renderStage();
    }
  }

  showLevelModal() {
    const grid = document.getElementById('level-grid-container');
    grid.innerHTML = '';
    for (let i = 1; i <= this.levelDb.length; i++) {
      const node = document.createElement('div');
      node.className = `level-node ${i > this.unlockedLevel ? 'locked' : ''} ${i < this.unlockedLevel ? 'completed' : ''}`;
      node.innerText = i;
      if (i <= this.unlockedLevel) {
        node.onclick = () => {
          this.loadLevel(i - 1);
          document.getElementById('modal-levels').classList.remove('active');
        };
      }
      grid.appendChild(node);
    }
    document.getElementById('modal-levels').classList.add('active');
  }
}

window.addEventListener('DOMContentLoaded', () => {
  window.game = new GameEngine();
});
</script>
