<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#EFE3C6">
<title>3D Screw Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#EFE3C6;font-family:'Segoe UI',Arial,sans-serif;user-select:none;touch-action:none;}

/* Game Container */
#game{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;}

/* ===== 3D ROAD SETUP ===== */
#track-container{
  position:relative;flex:1;overflow:hidden;
  perspective:800px;
  perspective-origin:50% 20%;
}

/* The moving road */
#road{
  position:absolute;left:50%;bottom:0;
  width:340px;height:200%;
  transform:translateX(-50%) rotateX(55deg);
  transform-origin:bottom center;
  transform-style:preserve-3d;
  background:#D4C4A3;
  border-left:10px solid #C2B08D;
  border-right:10px solid #C2B08D;
  box-shadow:0 0 50px rgba(0,0,0,0.2) inset;
}

/* Road Lines */
.lane-line{
  position:absolute;top:0;bottom:0;width:8px;
  background:repeating-linear-gradient(180deg,#FFF 0px,#FFF 40px,transparent 40px,transparent 80px);
  box-shadow:0 0 10px rgba(255,255,255,0.8);
  animation:moveRoad 1s linear infinite;
}
.lane-1{left:33.33%;transform:translateX(-50%);}
.lane-2{left:66.66%;transform:translateX(-50%);}
@keyframes moveRoad{from{background-position-y:0}to{background-position-y:80px}}

/* ===== PLAYER (Screw Plate) ===== */
#player{
  position:absolute;left:50%;bottom:15%;
  width:80px;height:80px;
  transform:translateX(-50%);
  transform-style:preserve-3d;
  z-index:10;
  transition:left 0.15s ease-out;
}
.plate-bg{
  position:absolute;inset:0;
  background:#FFF;
  border-radius:20px;
  border:4px solid #4A78FF; /* Default Blue */
  box-shadow:0 10px 0 #2A4AA0, 0 15px 20px rgba(0,0,0,0.3);
  display:flex;justify-content:center;align-items:center;gap:6px;
}
.plate-bg .hole{
  width:18px;height:18px;border-radius:50%;
  background:#A0A0A0;box-shadow:inset 0 3px 5px rgba(0,0,0,0.5);
}

/* Shield Effect */
#player.shielded .plate-bg{
  border-color:#00FF00 !important;
  box-shadow:0 10px 0 #008800, 0 0 30px #00FF00 !important;
}

/* ===== OBSTACLES (Leaf Plates) ===== */
.obstacle{
  position:absolute;
  width:90px;height:120px;
  transform-style:preserve-3d;
  background:#6B9B5E; /* Green Leaf */
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  border:3px solid #FFF;
  box-shadow:0 10px 15px rgba(0,0,0,0.2);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;
}
/* Colors for obstacles */
.obstacle.blue{background:#6BA8F0;}
.obstacle.purple{background:#B26FE8;}
.obstacle.green{background:#6B9B5E;}

/* Screws on obstacles */
.obstacle .screw{
  width:20px;height:20px;border-radius:50%;
  background:#A0A0A0;box-shadow:inset 0 3px 5px rgba(0,0,0,0.5);
  display:flex;justify-content:center;align-items:center;
  position:relative;
}
.obstacle .screw::after{
  content:'+';color:#666;font-weight:bold;font-size:14px;line-height:1;
}

/* ===== COLLECTIBLES ===== */
.coin{
  position:absolute;width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#FFD700,#FFA500);
  border:3px solid #FFF;
  box-shadow:0 0 15px #FFD700, 0 5px 10px rgba(0,0,0,0.3);
  display:flex;justify-content:center;align-items:center;
  font-size:18px;font-weight:bold;color:#8B4500;
  z-index:8;animation:spin 2s linear infinite;
}
@keyframes spin{100%{transform:rotateY(360deg)}}

.powerup{
  position:absolute;width:44px;height:44px;border-radius:50%;
  display:flex;justify-content:center;align-items:center;
  font-size:24px;z-index:8;box-shadow:0 0 20px currentColor;
  animation:bounce 1s infinite alternate;
}
@keyframes bounce{from{transform:scale(1)}to{transform:scale(1.2)}}
.powerup.magnet{background:#FF00FF;color:#FFF;}
.powerup.shield{background:#00FF00;color:#FFF;}

/* ===== UI OVERLAY (HUD) ===== */
#hud{
  position:absolute;top:0;left:0;right:0;padding:15px;
  display:flex;justify-content:space-between;align-items:flex-start;
  z-index:100;pointer-events:none;
}
.ui-box{
  background:rgba(255,255,255,0.9);
  border:3px solid #555;border-radius:15px;
  padding:8px 15px;font-size:18px;font-weight:bold;color:#333;
  box-shadow:0 5px 0 #555;text-align:center;
}
.ui-box .label{font-size:10px;color:#777;display:block;letter-spacing:1px;}

/* Progress Bar */
#progress-container{
  width:80%;height:12px;background:#FFF;
  border:2px solid #555;border-radius:10px;
  position:absolute;top:75px;left:10%;
  overflow:hidden;
}
#progress-bar{width:0%;height:100%;background:#00FF00;transition:width 0.3s;}

/* Level Text */
#levelText{
  position:absolute;top:95px;width:100%;text-align:center;
  font-weight:bold;color:#555;font-size:14px;letter-spacing:2px;z-index:100;
}

/* ===== SCREENS ===== */
.screen{
  position:absolute;inset:0;background:rgba(239,227,198,0.95);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  z-index:200;padding:20px;text-align:center;
}
.screen.hidden{display:none;}
.screen h1{font-size:32px;color:#333;margin-bottom:10px;text-shadow:0 3px 0 #FFF;}
.screen p{color:#555;font-size:16px;margin-bottom:20px;line-height:1.6;}

/* Buttons */
.btn{
  padding:15px 40px;font-size:20px;font-weight:bold;color:#FFF;
  background:#4A78FF;border:none;border-radius:15px;
  box-shadow:0 6px 0 #2A4AA0;cursor:pointer;
  transition:all 0.1s;margin-top:10px;width:80%;max-width:250px;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2A4AA0;}
.btn.red{background:#FF4A4A;box-shadow:0 6px 0 #A02A2A;}
.btn.green{background:#4CAF50;box-shadow:0 6px 0 #2E7D32;}

/* Ads Placeholder */
.ad-box{
  width:100%;max-width:300px;height:250px;
  background:#FFF;border:3px dashed #999;border-radius:15px;
  display:flex;justify-content:center;align-items:center;
  color:#999;font-size:18px;font-weight:bold;margin-top:20px;
  position:relative;
}
.ad-tag{
  position:absolute;top:5px;right:5px;background:#FFD700;
  color:#000;font-size:10px;padding:2px 6px;border-radius:5px;
}
.skip-btn{
  padding:8px 20px;background:#555;color:#FFF;border:none;
  border-radius:10px;font-size:14px;margin-top:15px;cursor:pointer;
}

/* ===== POWERUP BAR (Bottom) ===== */
#powerup-bar{
  position:absolute;bottom:20px;left:0;width:100%;
  display:flex;justify-content:center;gap:15px;z-index:100;
}
.pu-icon{
  width:60px;height:60px;background:#FFF;border:3px solid #555;border-radius:15px;
  display:flex;justify-content:center;align-items:center;font-size:28px;
  box-shadow:0 5px 0 #555;position:relative;
}
.pu-icon .ad-badge{
  position:absolute;bottom:-5px;right:-5px;
  background:#4CAF50;color:#FFF;font-size:9px;font-weight:bold;
  padding:2px 5px;border-radius:5px;border:1px solid #FFF;
}
</style>
</head>
<body>

<div id="game">
  <!-- HUD -->
  <div id="hud">
    <div class="ui-box"><span class="label">SCORE</span><span id="score">0</span></div>
    <div class="ui-box" id="coinBox" style="border-color:#FFA500;box-shadow:0 5px 0 #FFA500;">
      <span class="label">SCREWS</span>🔩 <span id="coins">0</span>
    </div>
    <div class="ui-box"><span class="label">BEST</span><span id="best">0</span></div>
  </div>
  
  <div id="progress-container"><div id="progress-bar"></div></div>
  <div id="levelText">LEVEL 1</div>

  <!-- 3D Track -->
  <div id="track-container">
    <div id="road">
      <div class="lane-line lane-1"></div>
      <div class="lane-line lane-2"></div>
    </div>
    
    <!-- Player Plate -->
    <div id="player">
      <div class="plate-bg">
        <div class="hole"></div><div class="hole"></div><div class="hole"></div>
      </div>
    </div>
  </div>

  <!-- Powerup Bar -->
  <div id="powerup-bar">
    <div class="pu-icon" id="puMagnet">🧲<div class="ad-badge">FREE</div></div>
    <div class="pu-icon" id="puShield">🛡️<div class="ad-badge">FREE</div></div>
  </div>

  <!-- Start Screen -->
  <div class="screen" id="startScreen">
    <h1>3D SCREW RUNNER</h1>
    <p>प्लेट को इकट्ठा करें 🔩<br>बाधाओं (पत्तों) से बचें 🍃</p>
    <button class="btn green" id="btnStart">START GAME</button>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="gameOverScreen">
    <h1 style="color:#FF4A4A;">GAME OVER</h1>
    <p style="font-size:24px;font-weight:bold;color:#333;">Score: <span id="finalScore">0</span></p>
    <button class="btn green" id="btnRestart" style="margin-top:20px;">PLAY AGAIN</button>
    <button class="btn" id="btnHome">HOME</button>
    <button class="btn red" id="btnRevive">REVIVE (WATCH AD)</button>
  </div>

  <!-- Ad Interstitial Screen -->
  <div class="screen hidden" id="adScreen">
    <h1>Advertisement</h1>
    <div class="ad-box">
      <div class="ad-tag">AD</div>
      AdMob / Unity Ads Placeholder
    </div>
    <button class="skip-btn" id="btnSkipAd">Skip Ad ▶</button>
  </div>

</div>

<script>
(function(){
'use strict';

// DOM Elements
const $ = id => document.getElementById(id);
const player = $('player');
const track = $('track-container');
const road = $('road');
const startScreen = $('startScreen');
const gameOverScreen = $('gameOverScreen');
const adScreen = $('adScreen');
const scoreEl = $('score'), coinsEl = $('coins'), bestEl = $('best');
const levelText = $('levelText'), progressBar = $('progress-bar');
const flash = document.createElement('div'); // For damage flash

flash.style.cssText = 'position:absolute;inset:0;background:#FF0000;opacity:0;pointer-events:none;z-index:90;transition:opacity 0.2s;';
document.getElementById('game').appendChild(flash);

// Game State
const LANES = [16.6, 50, 83.3]; // Percentages for 3 lanes
let currentLane = 1;
let score = 0, coins = 0;
let best = parseInt(localStorage.getItem('screwRunnerBest') || '0', 10);
let isRunning = false;
let isReviving = false;
let gameSpeed = 1; // Base speed
let level = 1;
let spawnRate = 1200; // ms
let lastSpawn = 0;
let spawnTimer, scoreTimer;
let obstacles = [];
let powerups = [];
let activePowerups = { magnet: 0, shield: 0 };

bestEl.textContent = best;

// Audio System
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if(type === 'coin') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if(type === 'powerup') {
        osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if(type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// Movement Logic
function movePlayer(dir) {
    if(!isRunning) return;
    let nextLane = currentLane + dir;
    if(nextLane >= 0 && nextLane <= 2) {
        currentLane = nextLane;
        player.style.left = LANES[currentLane] + '%';
    }
}

// Input Handling
document.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1);
    if(e.key === 'ArrowRight' || e.key === 'd') movePlayer(1);
});
track.addEventListener('touchstart', e => {
    const x = e.touches[0].clientX;
    if(x < window.innerWidth / 2) movePlayer(-1);
    else movePlayer(1);
});

// Game Loop Variables
let lastTime = performance.now();

function gameLoop(time) {
    if(!isRunning) return;
    
    const dt = time - lastTime;
    lastTime = time;
    
    // Difficulty Scaling
    gameSpeed = 1 + (score * 0.002); 
    level = Math.floor(score / 10) + 1;
    levelText.textContent = "LEVEL " + level;
    
    // Speed up road animation
    const roadSpeed = 0.5 + (gameSpeed * 0.3);
    document.querySelectorAll('.lane-line').forEach(el => {
        el.style.animationDuration = roadSpeed + 's';
    });

    // Spawn Logic
    if(time - lastSpawn > spawnRate) {
        spawnObject();
        lastSpawn = time;
        // Make spawning faster as game gets harder
        spawnRate = Math.max(400, 1200 - (level * 50)); 
    }

    // Move Objects (Manual DOM Movement for Collision Accuracy)
    const trackHeight = track.offsetHeight;
    const playerTop = trackHeight - (trackHeight * 0.15) - 80; // Approx player Y

    // Move Obstacles
    for(let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        let y = parseFloat(obs.style.top) || -150;
        y += (gameSpeed * 8 * (dt/16)); // speed factor
        obs.style.top = y + 'px';

        // Collision Check
        if(y > playerTop - 60 && y < playerTop + 80) {
            if(parseInt(obs.dataset.lane) === currentLane) {
                if(activePowerups.shield > 0) {
                    // Destroy obstacle with shield
                    obs.remove(); obstacles.splice(i, 1);
                    activePowerups.shield = 0;
                    player.classList.remove('shielded');
                    playSound('hit');
                } else {
                    gameOver(); return;
                }
            }
        }

        if(y > trackHeight + 200) {
            obs.remove(); obstacles.splice(i, 1);
        }
    }

    // Move Collectibles
    for(let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        let y = parseFloat(p.style.top) || -150;
        
        // Magnet effect (pull to player)
        if(activePowerups.magnet > 0 && p.dataset.type === 'coin') {
            let targetX = (window.innerWidth * LANES[currentLane] / 100);
            let currentX = parseFloat(p.style.left) || targetX;
            p.style.left = (currentX + (targetX - currentX) * 0.1) + 'px';
            y += 3; // Pull down faster
        } else {
            y += (gameSpeed * 8 * (dt/16));
        }
        
        p.style.top = y + 'px';

        // Collection Check
        if(y > playerTop - 40 && y < playerTop + 80) {
            let pX = parseFloat(p.style.left);
            let targetX = (window.innerWidth * LANES[currentLane] / 100) - 20;
            
            if(Math.abs(pX - targetX) < 50) {
                // Collected!
                if(p.dataset.type === 'coin') {
                    coins++; coinsEl.textContent = coins;
                    playSound('coin');
                } else {
                    activatePowerup(p.dataset.type);
                }
                p.remove(); powerups.splice(i, 1);
                continue;
            }
        }

        if(y > trackHeight + 200) {
            p.remove(); powerups.splice(i, 1);
        }
    }

    // Progress Bar
    progressBar.style.width = ((score % 10) * 10) + '%';

    requestAnimationFrame(gameLoop);
}

function spawnObject() {
    const lane = Math.floor(Math.random() * 3);
    const isPowerup = Math.random() < 0.15; // 15% chance for powerup/coin
    const isCoin = Math.random() < 0.7; // of powerup chance, 70% coin
    
    const el = document.createElement('div');
    el.dataset.lane = lane;
    // Center X based on lane percentage
    const laneX = (window.innerWidth * LANES[lane] / 100) - 45; // -45 to center
    el.style.left = laneX + 'px';
    el.style.top = '-150px';

    if(isPowerup) {
        if(isCoin) {
            el.className = 'coin';
            el.textContent = '🔩'; // Screw icon
            el.dataset.type = 'coin';
        } else {
            el.className = 'powerup ' + (Math.random() > 0.5 ? 'magnet' : 'shield');
            el.textContent = Math.random() > 0.5 ? '🧲' : '🛡️';
            el.dataset.type = el.classList.contains('magnet') ? 'magnet' : 'shield';
        }
        track.appendChild(el);
        powerups.push(el);
    } else {
        // Obstacle (Leaf Plate)
        el.className = 'obstacle ' + ['blue', 'purple', 'green'][Math.floor(Math.random()*3)];
        el.innerHTML = `<div class="screw"></div><div class="screw"></div>`;
        track.appendChild(el);
        obstacles.push(el);
    }
}

function activatePowerup(type) {
    playSound('powerup');
    if(type === 'magnet') {
        activePowerups.magnet = 8000; // 8 seconds
        setTimeout(() => activePowerups.magnet = 0, 8000);
    } else if(type === 'shield') {
        activePowerups.shield = 1; // One hit protection
        player.classList.add('shielded');
    }
}

function startGame() {
    // Reset everything
    score = 0; coins = 0; gameSpeed = 1; level = 1;
    currentLane = 1; isRunning = true; isReviving = false;
    activePowerups = { magnet: 0, shield: 0 };
    player.classList.remove('shielded');
    
    scoreEl.textContent = '0'; coinsEl.textContent = '0';
    player.style.left = '50%';
    document.querySelectorAll('.obstacle, .coin, .powerup').forEach(el => el.remove());
    obstacles = []; powerups = [];
    
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    
    lastTime = performance.now();
    lastSpawn = performance.now();
    
    scoreTimer = setInterval(() => {
        if(isRunning) { score++; scoreEl.textContent = score; }
    }, 1000);

    requestAnimationFrame(gameLoop);
}

function gameOver() {
    isRunning = false;
    clearInterval(scoreTimer);
    playSound('hit');
    
    // Flash effect
    flash.style.opacity = '0.5';
    setTimeout(() => flash.style.opacity = '0', 200);
    
    if(score > best) {
        best = score;
        localStorage.setItem('screwRunnerBest', best);
        bestEl.textContent = best;
    }
    
    $('finalScore').textContent = score;
    
    // Show Ad before Game Over
    showInterstitialAd(() => {
        gameOverScreen.classList.remove('hidden');
    });
}

// ==========================================
// ADS INTEGRATION LOGIC
// ==========================================
function showInterstitialAd(callback) {
    adScreen.classList.remove('hidden');
    let skipped = false;
    const skipBtn = $('btnSkipAd');
    
    // Simulate ad loading for 2 seconds, then enable skip
    skipBtn.style.display = 'none';
    setTimeout(() => { skipBtn.style.display = 'block'; }, 2000);

    const skipAction = () => {
        if(skipped) return;
        skipped = true;
        adScreen.classList.add('hidden');
        skipBtn.removeEventListener('click', skipAction);
        if(callback) callback();
        
        // Here you would call: admob.interstitial.hide();
    };
    skipBtn.addEventListener('click', skipAction);
}

// Revive via Ad
$('btnRevive').addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    adScreen.classList.remove('hidden');
    
    // Simulate Rewarded Ad
    setTimeout(() => {
        adScreen.classList.add('hidden');
        // Revive Player
        isRunning = true;
        isReviving = true;
        gameOverScreen.classList.add('hidden');
        
        // Clear nearest obstacles
        obstacles.forEach(o => o.remove());
        obstacles = [];
        
        // Give temporary shield
        activatePowerup('shield');
        
        scoreTimer = setInterval(() => { if(isRunning) { score++; scoreEl.textContent = score; } }, 1000);
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }, 3000); // 3 sec fake ad
});

// Free Powerup Buttons
$('puMagnet').addEventListener('click', () => {
    if(!isRunning) return;
    // Here you'd show a rewarded ad. We simulate success:
    activatePowerup('magnet');
    // In real app: admob.rewarded.load().then(() => admob.rewarded.show());
});

$('puShield').addEventListener('click', () => {
    if(!isRunning) return;
    activatePowerup('shield');
});

// Buttons
$('btnStart').addEventListener('click', startGame);
$('btnRestart').addEventListener('click', startGame);
$('btnHome').addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    document.querySelectorAll('.obstacle, .coin, .powerup').forEach(el => el.remove());
    obstacles = []; powerups = [];
});

})();
</script>
</body>
</html>
