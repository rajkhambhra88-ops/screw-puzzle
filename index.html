<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050520">
<title>3D Cube Runner - Clean Look</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:#050520;
  overflow:hidden;height:100vh;width:100vw;
  display:flex;justify-content:center;align-items:center;
  touch-action:none;user-select:none;
}

/* ===== SCENE (साफ़ 3D स्पेस) ===== */
#scene{
  position:relative;width:100%;height:100%;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 35%, #1a1a5e 0%, #0a0a2e 40%, #050520 100%);
}

/* तारे - हल्के, पीछे */
.stars{
  position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 15% 20%, #fff, transparent),
    radial-gradient(1px 1px at 35% 45%, #cdf, transparent),
    radial-gradient(1.5px 1.5px at 55% 15%, #fff, transparent),
    radial-gradient(1px 1px at 75% 55%, #fcd, transparent),
    radial-gradient(1.5px 1.5px at 88% 25%, #fff, transparent),
    radial-gradient(1px 1px at 25% 75%, #fff, transparent),
    radial-gradient(1px 1px at 65% 85%, #cff, transparent),
    radial-gradient(1.5px 1.5px at 92% 72%, #fff, transparent);
  background-size:100% 100%;
  animation:twinkle 3s ease-in-out infinite alternate;
  opacity:.85;
  pointer-events:none;
}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}

/* हॉरिज़ॉन्ट ग्लो लाइन (डेप्थ) */
.horizon{
  position:absolute;left:0;right:0;top:38%;
  height:3px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(0,240,255,0) 10%,
    rgba(0,240,255,.9) 50%,
    rgba(0,240,255,0) 90%,
    transparent 100%);
  box-shadow:0 0 30px rgba(0,240,255,.8), 0 0 60px rgba(0,240,255,.4);
  z-index:2;
  pointer-events:none;
}

/* ===== रोड (सीधी, साफ़, धुंधली नहीं) ===== */
#roadWrap{
  position:absolute;left:50%;top:38%;bottom:0;
  width:min(360px, 78vw);
  transform:translateX(-50%);
  overflow:hidden;
  z-index:3;
}

/* रोड बॉडी - ग्रेडिएंट, कोई blur नहीं */
#road{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    #151538 0%,
    #1a1a44 30%,
    #20204e 100%);
  border-left:3px solid #00d8ee;
  border-right:3px solid #00d8ee;
  box-shadow:
    inset 0 0 25px rgba(0,200,255,.2),
    0 0 25px rgba(0,200,255,.35);
  /* स्पष्ट किनारे */
  image-rendering:crisp-edges;
}

/* लेन डिवाइडर - दो लाइनें (3 lanes) */
.lane-line{
  position:absolute;top:0;bottom:0;
  width:3px;
  background:repeating-linear-gradient(180deg,
    #ffe500 0, #ffe500 20px,
    transparent 20px, transparent 40px);
  animation:roadMove 0.7s linear infinite;
  box-shadow:0 0 6px rgba(255,229,0,.7);
}
.lane-line.l1{left:33.33%;transform:translateX(-50%);}
.lane-line.l2{left:66.66%;transform:translateX(-50%);}

@keyframes roadMove{
  from{background-position-y:0}
  to{background-position-y:40px}
}

/* रोड पर हल्की ग्रिड (डेप्थ के लिए) */
#road::after{
  content:'';
  position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(180deg,
      rgba(0,240,255,.06) 0px,
      rgba(0,240,255,.06) 1px,
      transparent 1px,
      transparent 60px);
  pointer-events:none;
}

/* रोड के किनारे ग्लो */
#roadWrap::before,#roadWrap::after{
  content:'';position:absolute;top:0;bottom:0;width:8px;
  background:linear-gradient(180deg,transparent,rgba(0,240,255,.6),rgba(0,240,255,.9));
  filter:blur(4px);
  z-index:2;
}
#roadWrap::before{left:-4px;}
#roadWrap::after{right:-4px;}

/* ===== प्लेयर क्यूब (स्पष्ट) ===== */
#player{
  position:absolute;left:50%;bottom:130px;
  width:60px;height:60px;
  transform:translateX(-50%);
  transform-style:preserve-3d;
  animation:playerFloat 1.4s ease-in-out infinite;
  z-index:20;
}
@keyframes playerFloat{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-6px)}
}

.cube{
  position:absolute;width:60px;height:60px;
  transform-style:preserve-3d;
  animation:cubeRotate 4s linear infinite;
}
@keyframes cubeRotate{
  from{transform:rotateX(-22deg) rotateY(0)}
  to{transform:rotateX(-22deg) rotateY(360deg)}
}

.face{
  position:absolute;width:60px;height:60px;
  border:2px solid #7fffff;
  /* स्पष्टता के लिए */
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  image-rendering:crisp-edges;
}
.front {transform:translateZ(30px);           background:linear-gradient(135deg,#00e8ff,#0080ff);}
.back  {transform:rotateY(180deg) translateZ(30px); background:linear-gradient(135deg,#00c0dd,#0060cc);}
.right {transform:rotateY(90deg)  translateZ(30px); background:linear-gradient(135deg,#00d0ee,#0070dd);}
.left  {transform:rotateY(-90deg) translateZ(30px); background:linear-gradient(135deg,#00e0ff,#0090ee);}
.top   {transform:rotateX(90deg)  translateZ(30px); background:linear-gradient(135deg,#7fffff,#00b0ff);}
.bottom{transform:rotateX(-90deg) translateZ(30px); background:linear-gradient(135deg,#00a0bb,#0050bb);}

/* प्लेयर की ज़मीन पर छाया - स्पष्ट */
#player::after{
  content:'';
  position:absolute;
  bottom:-38px;left:50%;
  transform:translateX(-50%);
  width:70px;height:16px;
  background:radial-gradient(ellipse,rgba(0,240,255,.85),rgba(0,240,255,0) 70%);
  border-radius:50%;
  z-index:-1;
}

/* Shield effect */
#player.shielded .face{
  border-color:#00ff88;
  box-shadow:0 0 12px #00ff88,inset 0 0 10px rgba(0,255,136,.5);
}

/* ===== ऑब्सटैकल (स्पष्ट 3D) ===== */
.obstacle{
  position:absolute;
  width:48px;height:48px;
  transform-style:preserve-3d;
  animation:obsSpin 2s linear infinite;
  z-index:15;
}
@keyframes obsSpin{
  from{transform:rotateX(-15deg) rotateY(0)}
  to{transform:rotateX(-15deg) rotateY(360deg)}
}
.obstacle .face{
  width:48px;height:48px;
  border:2px solid #ffcc44;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.obstacle .front {transform:translateZ(24px);           background:linear-gradient(135deg,#ff2f6b,#c4003a);}
.obstacle .back  {transform:rotateY(180deg) translateZ(24px); background:linear-gradient(135deg,#e0004a,#90002a);}
.obstacle .right {transform:rotateY(90deg)  translateZ(24px); background:linear-gradient(135deg,#ff1f5b,#aa003a);}
.obstacle .left  {transform:rotateY(-90deg) translateZ(24px); background:linear-gradient(135deg,#ff3060,#bb0044);}
.obstacle .top   {transform:rotateX(90deg)  translateZ(24px); background:linear-gradient(135deg,#ff5588,#dd0066);}
.obstacle .bottom{transform:rotateX(-90deg) translateZ(24px); background:linear-gradient(135deg,#cc0044,#880033);}

/* Coin (स्पष्ट) */
.coin{
  position:absolute;
  width:34px;height:34px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffaa,#ffd000 45%,#b07800 100%);
  box-shadow:0 0 12px #ffd000,0 0 24px rgba(255,208,0,.5);
  animation:coinSpin .8s linear infinite;
  z-index:14;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;color:#8a5b00;
  text-shadow:0 1px 0 #fff3a0;
}
@keyframes coinSpin{
  from{transform:rotateY(0)}
  to{transform:rotateY(360deg)}
}

/* Power-up */
.powerup{
  position:absolute;
  width:42px;height:42px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;z-index:14;
  animation:powFloat 1s ease-in-out infinite;
}
@keyframes powFloat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}
.powerup.shield{background:radial-gradient(circle,#00ff88,#006622);box-shadow:0 0 18px #00ff88;}
.powerup.magnet{background:radial-gradient(circle,#ff40ff,#770077);box-shadow:0 0 18px #ff40ff;}
.powerup.slow  {background:radial-gradient(circle,#40aaff,#003377);box-shadow:0 0 18px #40aaff;}
.powerup.double{background:radial-gradient(circle,#ffaa00,#884400);box-shadow:0 0 18px #ffaa00;}

/* ===== HUD ===== */
#hud{
  position:absolute;top:0;left:0;right:0;
  padding:12px 16px;
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:8px;z-index:100;pointer-events:none;flex-wrap:wrap;
}
.score-box{
  background:rgba(5,5,30,.85);
  border:2px solid #00d8ee;
  border-radius:12px;
  padding:6px 14px;
  color:#00e8ff;font-size:16px;font-weight:bold;
  box-shadow:0 0 15px rgba(0,216,238,.45);
  text-align:center;min-width:60px;
}
.score-box .label{font-size:9px;color:#88ccff;display:block;letter-spacing:1px;font-weight:600;}
#coinBox{border-color:#ffcc00;color:#ffcc00;box-shadow:0 0 15px rgba(255,204,0,.45);}
#coinBox .label{color:#ffe088;}
#highScore{border-color:#ffd000;color:#ffe000;box-shadow:0 0 15px rgba(255,208,0,.45);}
#highScore .label{color:#ffe088;}

/* Sound toggle */
#soundToggle{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:42px;height:42px;border-radius:50%;
  background:rgba(5,5,30,.85);
  border:2px solid #00d8ee;
  color:#00e8ff;font-size:19px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:150;
  box-shadow:0 0 12px rgba(0,216,238,.35);
}
#soundToggle.muted{border-color:#555;color:#666;box-shadow:none;}

/* Power-up bar */
#powerupBar{
  position:absolute;top:82px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:100;pointer-events:none;flex-wrap:wrap;justify-content:center;
}
.pu-indicator{
  background:rgba(5,5,30,.9);
  border:2px solid currentColor;
  border-radius:20px;
  padding:3px 10px;font-size:12px;font-weight:bold;
  display:flex;align-items:center;gap:5px;
  animation:pulse .8s ease-in-out infinite alternate;
}
@keyframes pulse{from{opacity:.75}to{opacity:1}}

/* Daily challenge */
#dailyChallenge{
  position:absolute;top:120px;left:50%;transform:translateX(-50%);
  background:rgba(120,0,120,.35);
  border:2px solid #ff40ff;border-radius:10px;
  padding:6px 14px;color:#ffaaff;font-size:12px;font-weight:bold;
  z-index:100;text-align:center;
  box-shadow:0 0 15px rgba(255,64,255,.4);
  max-width:90%;
}

/* Controls */
#controls{
  position:absolute;bottom:18px;left:0;right:0;
  display:flex;justify-content:space-between;
  padding:0 18px;z-index:100;pointer-events:none;
}
.ctrl-btn{
  width:76px;height:76px;border-radius:50%;
  background:rgba(0,216,238,.15);
  border:3px solid #00d8ee;
  color:#00e8ff;font-size:34px;
  display:flex;align-items:center;justify-content:center;
  pointer-events:auto;cursor:pointer;
  box-shadow:0 0 20px rgba(0,216,238,.4);
  transition:transform .1s,background .1s;
}
.ctrl-btn:active{
  background:rgba(0,216,238,.4);
  transform:scale(.9);
  box-shadow:0 0 35px rgba(0,216,238,.8);
}

/* Screens */
.screen{
  position:absolute;inset:0;
  background:rgba(3,3,20,.94);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  z-index:200;padding:20px;text-align:center;
  transition:opacity .35s;overflow-y:auto;
}
.screen.hidden{opacity:0;pointer-events:none;display:none;}
.screen h1{
  font-size:38px;color:#00e8ff;
  text-shadow:0 0 12px #00d8ee,0 0 24px #0080ff;
  margin-bottom:8px;letter-spacing:2px;
}
.screen h2{font-size:18px;color:#ffd000;margin-bottom:18px;text-shadow:0 0 10px #ffd000;}
.screen p{color:#aaccff;font-size:14px;line-height:1.7;margin-bottom:14px;max-width:360px;}
.btn{
  padding:13px 38px;font-size:18px;font-weight:bold;
  color:#001133;
  background:linear-gradient(135deg,#00e8ff,#00a0ff);
  border:none;border-radius:12px;cursor:pointer;
  box-shadow:0 0 22px rgba(0,216,238,.55);
  letter-spacing:1.5px;transition:transform .15s;
  margin-top:8px;
}
.btn:active{transform:scale(.95);}
.btn.secondary{
  background:linear-gradient(135deg,#ff2f6b,#c4003a);
  color:#fff;box-shadow:0 0 22px rgba(255,47,107,.55);
  font-size:14px;padding:10px 28px;margin-top:10px;
}
.btn.tertiary{
  background:linear-gradient(135deg,#ff40ff,#8800cc);
  color:#fff;box-shadow:0 0 22px rgba(255,64,255,.55);
  font-size:14px;padding:10px 28px;margin-top:10px;
}
.final-score{
  font-size:52px;color:#ffd000;
  text-shadow:0 0 22px #ffd000;
  margin:6px 0;font-weight:bold;
}
.new-record{
  color:#ff40ff;font-size:16px;font-weight:bold;
  text-shadow:0 0 12px #ff40ff;
  animation:pulse .8s ease-in-out infinite alternate;
  margin-bottom:8px;
}

/* Leaderboard */
.leaderboard{width:100%;max-width:340px;margin:12px 0;max-height:240px;overflow-y:auto;}
.lb-row{
  display:flex;justify-content:space-between;
  padding:8px 12px;background:rgba(0,216,238,.06);
  border-radius:8px;margin-bottom:5px;font-size:14px;color:#aaccff;
  border-left:3px solid #00d8ee;
}
.lb-row.top1{border-left-color:#ffd000;background:rgba(255,208,0,.12);color:#ffe000;}
.lb-row.top2{border-left-color:#c0c0c0;background:rgba(192,192,192,.10);color:#e0e0e0;}
.lb-row.top3{border-left-color:#cd7f32;background:rgba(205,127,50,.10);color:#e0a060;}
.lb-row.you{border-left-color:#ff40ff;background:rgba(255,64,255,.12);color:#ffaaff;}
.lb-rank{font-weight:bold;min-width:28px;}
.lb-name{flex:1;margin:0 8px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-score{font-weight:bold;color:#00e8ff;}

/* Name input */
.name-input{
  padding:10px 18px;border:2px solid #00d8ee;
  border-radius:10px;background:rgba(0,0,0,.55);
  color:#00e8ff;font-size:15px;text-align:center;
  outline:none;width:240px;margin:8px 0;
}
.name-input::placeholder{color:#4488aa;}

/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:12px;}
.tab{
  padding:7px 18px;background:rgba(0,0,0,.4);
  border:2px solid #333;color:#666;border-radius:8px;
  cursor:pointer;font-size:13px;font-weight:bold;transition:all .2s;
}
.tab.active{
  border-color:#00d8ee;color:#00e8ff;
  background:rgba(0,216,238,.15);
  box-shadow:0 0 12px rgba(0,216,238,.4);
}

/* Ads */
#adBanner{
  position:absolute;bottom:0;left:0;right:0;height:56px;
  background:rgba(0,0,0,.75);border-top:1px solid #222;
  display:none;justify-content:center;align-items:center;
  color:#555;font-size:11px;z-index:150;letter-spacing:2px;
}
#adBanner.active{display:flex;}
#adInterstitial{
  position:absolute;inset:0;background:rgba(0,0,0,.96);
  display:none;flex-direction:column;justify-content:center;
  align-items:center;z-index:300;color:#fff;text-align:center;
}
#adInterstitial.active{display:flex;}
#adInterstitial .ad-box{
  width:290px;height:380px;
  background:linear-gradient(135deg,#12122e,#222250);
  border:2px dashed #333;border-radius:12px;
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;color:#555;margin-bottom:16px;padding:16px;
}
.skip-btn{
  padding:9px 22px;background:transparent;
  border:2px solid #00d8ee;color:#00e8ff;
  border-radius:8px;cursor:pointer;font-size:13px;letter-spacing:1px;
}

#flash{
  position:absolute;inset:0;background:#ff2f6b;
  opacity:0;pointer-events:none;z-index:90;transition:opacity .15s;
}
#flash.active{opacity:.45;}

/* ===== Mobile ===== */
@media(max-width:500px){
  .screen h1{font-size:28px;}
  .ctrl-btn{width:68px;height:68px;font-size:28px;}
  .score-box{font-size:14px;padding:5px 10px;min-width:50px;}
  .score-box .label{font-size:8px;}
  #player{width:50px;height:50px;bottom:110px;}
  .face{width:50px;height:50px;}
  .front {transform:translateZ(25px);}
  .back  {transform:rotateY(180deg) translateZ(25px);}
  .right {transform:rotateY(90deg)  translateZ(25px);}
  .left  {transform:rotateY(-90deg) translateZ(25px);}
  .top   {transform:rotateX(90deg)  translateZ(25px);}
  .bottom{transform:rotateX(-90deg) translateZ(25px);}
  #roadWrap{width:88vw;}
  #player::after{bottom:-30px;width:58px;height:12px;}
}
</style>
</head>
<body>

<div id="scene">
  <div class="stars"></div>
  <div class="horizon"></div>

  <div id="roadWrap">
    <div id="road">
      <div class="lane-line l1"></div>
      <div class="lane-line l2"></div>
    </div>
  </div>

  <div id="player">
    <div class="cube">
      <div class="face front"></div><div class="face back"></div>
      <div class="face right"></div><div class="face left"></div>
      <div class="face top"></div><div class="face bottom"></div>
    </div>
  </div>

  <div id="flash"></div>

  <div id="hud">
    <div class="score-box"><span class="label">SCORE</span><span id="score">0</span></div>
    <div class="score-box" id="coinBox"><span class="label">COINS</span><span id="coins">0</span></div>
    <div class="score-box" id="highScore"><span class="label">BEST</span><span id="best">0</span></div>
  </div>

  <div id="powerupBar"></div>
  <div id="dailyChallenge"></div>
  <div id="soundToggle">🔊</div>

  <div id="controls">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
  </div>

  <div class="screen" id="startScreen">
    <h1>3D CUBE RUNNER</h1>
    <h2>✦ CLEAN LOOK EDITION ✦</h2>
    <p>🪙 कोइन इकट्ठा करें<br>⚡ पावर-अप उठाएँ<br>💀 बाधाओं से बचें</p>
    <button class="btn" id="btnStart">START GAME</button>
    <button class="btn tertiary" id="btnLeaderboard">🏆 LEADERBOARD</button>
  </div>

  <div class="screen hidden" id="gameOverScreen">
    <h1 style="color:#ff2f6b;text-shadow:0 0 14px #ff2f6b;">GAME OVER</h1>
    <div class="final-score" id="finalScore">0</div>
    <div style="color:#ffcc00;font-size:16px;margin-bottom:8px;">🪙 <span id="finalCoins">0</span> coins</div>
    <div class="new-record hidden" id="newRecord">✦ NEW RECORD! ✦</div>
    <button class="btn" id="btnRestart">PLAY AGAIN</button>
    <button class="btn tertiary" id="btnViewLeaderboard">🏆 LEADERBOARD</button>
    <button class="btn secondary" id="btnHome">HOME</button>
  </div>

  <div class="screen hidden" id="leaderboardScreen">
    <h1 style="font-size:26px;">🏆 LEADERBOARD</h1>
    <div class="tabs">
      <div class="tab active" data-tab="global">🌍 Global</div>
      <div class="tab" data-tab="local">📱 Local</div>
    </div>
    <input type="text" class="name-input" id="playerName" placeholder="अपना नाम लिखें..." maxlength="12">
    <div class="leaderboard" id="leaderboardList">
      <div style="color:#666;padding:20px;">लोड हो रहा है...</div>
    </div>
    <button class="btn secondary" id="btnLbBack">BACK</button>
  </div>

  <div id="adBanner">📢 AD BANNER</div>
  <div id="adInterstitial">
    <div class="ad-box">
      <div style="font-size:40px;">📱</div>
      <div style="margin-top:12px;color:#888;">INTERSTITIAL AD</div>
      <small style="color:#444;margin-top:12px;font-size:11px;">AdMob / AdSense / Unity Ads यहाँ लगाएँ</small>
    </div>
    <button class="skip-btn" id="skipAd">SKIP AD ▶</button>
  </div>
</div>

<script>
/* =====================================================
   यहाँ वही पूरा JavaScript गेम लॉजिक डालें
   जो पिछले वर्ज़न में था — कॉइन, पावरअप, फायरबेस,
   लीडरबोर्ड, डेली चैलेंज, साउंड, आदि।
