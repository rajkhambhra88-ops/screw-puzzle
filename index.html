<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UNSCREW NUTS 3D - Premium Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #E8DAB2; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; touch-action: pan-y pinch-zoom; }
    body { display: flex; align-items: center; justify-content: center; }
    
    /* Cream Background matching the photo */
    #game-container { width: 100%; max-width: 480px; height: 100%; max-height: 900px; background: #F2E8C6; position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.2); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .ui-layer > * { pointer-events: auto; }
    
    /* TOP BAR STYLING */
    #top-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 20; }
    #level-badge { background: #fff; border: 3px solid #D3C59C; border-radius: 20px; padding: 4px 16px; font-weight: 900; font-size: 18px; color: #5A4A3A; text-shadow: 0 1px 0 #fff; box-shadow: 0 4px 0 #C2B280; }
    
    /* BOXES TRAY AT TOP */
    #tray-container { position: absolute; top: 60px; left: 10px; right: 10px; display: flex; gap: 10px; z-index: 20; transition: all 0.3s; }
    
    .tray-box { flex: 1; height: 70px; background: #fff; border-radius: 16px; border: 4px solid #A8D5BA; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 6px 0 #8DBFA1; position: relative; overflow: hidden; }
    .tray-box.red { border-color: #F28B82; box-shadow: 0 6px 0 #D9786D; }
    .tray-box.blue { border-color: #8AB4F8; box-shadow: 0 6px 0 #779DDA; }
    .tray-box.yellow { border-color: #FDE293; box-shadow: 0 6px 0 #E5C77A; }
    .tray-box.green { border-color: #81C995; box-shadow: 0 6px 0 #6CAF81; }
    .tray-box.purple { border-color: #C58AF9; box-shadow: 0 6px 0 #A86EDC; }
    
    .tray-slot { width: 18px; height: 18px; border-radius: 50%; background: #E0E0E0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
    .tray-slot.filled { background: #555; box-shadow: inset 0 -2px 4px rgba(255,255,255,0.4); }
    
    .ad-box-btn { flex: 1; height: 70px; background: #F6D365; border-radius: 16px; border: 4px solid #E5B93F; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 0 #C99D30; cursor: pointer; position: relative; }
    .ad-box-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #C99D30; }
    .ad-box-btn .plus { font-size: 32px; font-weight: 900; color: #7A5E15; line-height: 1; }
    .ad-box-btn .ad-tag { position: absolute; bottom: 4px; right: 4px; background: #4CAF50; color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 8px; }

    /* BOTTOM BOOSTERS */
    #bottom-bar { position: absolute; bottom: 20px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 10px; z-index: 20; }
    .booster-btn { flex: 1; height: 60px; background: #F6D365; border-radius: 12px; border: 3px solid #E5B93F; box-shadow: 0 5px 0 #C99D30; display: flex; align-items: center; justify-content: center; font-size: 30px; position: relative; cursor: pointer; }
    .booster-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #C99D30; }
    .booster-btn .count { position: absolute; top: -8px; right: -8px; background: #fff; border: 2px solid #333; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #333; }
    
    /* PROGRESS STAR */
    #progress-star { position: absolute; top: 10px; right: 10px; width: 50px; height: 50px; background: #888; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: white; z-index: 20; }
    
    /* MODALS */
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(242,232,198,0.95); backdrop-filter: blur(5px); z-index: 100; padding: 24px; text-align: center; color: #4A3B32; }
    .screen.hidden { display: none; }
    .screen h1 { font-size: 32px; font-weight: 900; color: #D35400; margin-bottom: 10px; text-shadow: 0 2px 0 #fff; }
    .screen p { font-size: 16px; margin-bottom: 20px; font-weight: 600; }
    .btn { background: #4CAF50; border: 3px solid #388E3C; border-radius: 40px; color: white; font-weight: 900; font-size: 18px; padding: 12px 30px; box-shadow: 0 6px 0 #2E7D32; cursor: pointer; text-transform: uppercase; }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2E7D32; }
    .btn.blue { background: #42A5F5; border-color: #1E88E5; box-shadow: 0 6px 0 #1565C0; }
    .btn.gold { background: #F6D365; border-color: #E5B93F; box-shadow: 0 6px 0 #C99D30; color: #5A4A3A; }
    
    #toast { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <!-- TOP BAR -->
    <div id="top-bar">
      <div id="level-badge">LEVEL 1</div>
      <div id="progress-star">0%</div>
    </div>

    <!-- TRAY AT TOP -->
    <div id="tray-container">
      <!-- Boxes will be injected here by JS -->
    </div>

    <!-- BOTTOM BAR -->
    <div id="bottom-bar">
      <div class="booster-btn" id="btn-drill">🔫<span class="count" id="count-drill">2</span></div>
      <div class="booster-btn" id="btn-hammer">🔨<span class="count" id="count-hammer">1</span></div>
      <div class="booster-btn" id="btn-brush">🖌️<span class="count" id="count-brush">1</span></div>
    </div>
  </div>

  <!-- START SCREEN -->
  <div class="screen" id="home-screen">
    <h1>UNSCREW NUTS</h1>
    <p>Remove the screws to clear the leaves.<br>Match colors to the top boxes!</p>
    <button class="btn" id="play-btn" style="margin-top: 20px;">PLAY</button>
    <button class="btn blue" id="ad-coins-btn" style="margin-top: 15px; font-size: 14px; padding: 10px 20px;">WATCH AD +100 🪙</button>
  </div>

  <!-- VICTORY SCREEN -->
  <div class="screen hidden" id="victory-screen">
    <h1>LEVEL COMPLETE!</h1>
    <div style="font-size: 50px; margin: 10px 0;">⭐⭐⭐</div>
    <p>Coins earned: <span id="victory-coins">+50</span></p>
    <button class="btn" id="next-level-btn" style="margin-top: 20px;">NEXT LEVEL</button>
  </div>

  <!-- DEMO AD SCREEN -->
  <div class="screen hidden" id="ad-screen" style="background: #222; color: white;">
    <h1 style="color: #F6D365;">DEMO AD</h1>
    <p>This is a placeholder for a real advertisement.</p>
    <p style="font-size: 40px; margin: 30px 0;">📺</p>
    <p>Please wait <span id="ad-timer">3</span> seconds...</p>
    <button class="btn gold hidden" id="ad-close-btn" style="margin-top: 20px;">CLAIM REWARD</button>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ============================================================
   UNSCREW NUTS - PREMIUM 2D CARTOON EDITION
   ============================================================ */

(function() {
'use strict';

const CONFIG = {
  BASE_COINS: 50,
  SCREW_RADIUS: 14,
  HOLE_RADIUS: 8,
  GRAVITY: 1200,
  COLORS: [
    { id: 'red', hex: '#E57373', border: '#F28B82' },
    { id: 'blue', hex: '#64B5F6', border: '#8AB4F8' },
    { id: 'green', hex: '#81C784', border: '#81C995' },
    { id: 'yellow', hex: '#FFD54F', border: '#FDE293' },
    { id: 'purple', hex: '#BA68C8', border: '#C58AF9' }
  ],
  SHAPES: ['leaf', 'petal', 'hexagon']
};

let gameState = {
  level: 1,
  coins: 100,
  activeBoxes: [], // Array of box objects { colorId, capacity, filled: [] }
  extraBoxesUnlocked: 0,
  maxBoxesLimit: 4,
  currentLevelData: null,
  paused: false,
  // Boosters
  drill: 2, hammer: 1, brush: 1,
  animFrame: null,
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let logicalWidth = 400, logicalHeight = 800;

function resizeCanvas() {
  const container = document.getElementById('game-container');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = container.getBoundingClientRect();
  logicalWidth = rect.width;
  logicalHeight = rect.height;
  canvas.width = logicalWidth * dpr;
  canvas.height = logicalHeight * dpr;
  canvas.style.width = logicalWidth + 'px';
  canvas.style.height = logicalHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================
// LEVEL GENERATOR (LEAF & PETAL SHAPES)
// ============================================================
function generateLevel(levelNum) {
  const boards = [];
  const screws = [];
  const layers = Math.min(2 + Math.floor(levelNum / 3), 5);
  const numColors = Math.min(2 + Math.floor(levelNum / 4), 5);
  const activeColors = CONFIG.COLORS.slice(0, numColors);
  const boxCapacity = 3; // 3 slots per box

  const cx = logicalWidth / 2;
  const cy = 400; // Center of play area

  // Create Layers
  for (let l = 0; l < layers; l++) {
    const shape = CONFIG.SHAPES[(l + levelNum) % CONFIG.SHAPES.length];
    const size = 140 - (l * 15);
    
    // Random offset to make them overlap
    const ox = (Math.random() - 0.5) * 60;
    const oy = (Math.random() - 0.5) * 60;
    const bx = cx - size/2 + ox;
    const by = cy - size/2 + oy;

    boards.push({
      id: l, x: bx, y: by, w: size, h: size, shape: shape, layer: l,
      removed: false, fallY: 0, fallVel: 0, rotation: 0, swingAngle: 0,
      color: activeColors[l % activeColors.length].hex,
      colorId: activeColors[l % activeColors.length].id
    });

    // Add Screws
    const screwCount = 2 + Math.floor(levelNum / 4);
    let pos = [];
    if (shape === 'leaf') {
      // 4 points on a leaf
      pos = [
        { x: bx + size*0.5, y: by + size*0.15 },
        { x: bx + size*0.2, y: by + size*0.5 },
        { x: bx + size*0.8, y: by + size*0.5 },
        { x: bx + size*0.5, y: by + size*0.85 }
      ];
    } else if (shape === 'petal') {
      // 3 points
      pos = [
        { x: bx + size*0.5, y: by + size*0.2 },
        { x: bx + size*0.2, y: by + size*0.8 },
        { x: bx + size*0.8, y: by + size*0.8 }
      ];
    } else {
      // Hexagon
      for(let i=0; i<6; i++) {
        const a = (i/6) * Math.PI * 2;
        pos.push({ x: bx + size/2 + Math.cos(a)*size*0.35, y: by + size/2 + Math.sin(a)*size*0.35 });
      }
    }

    pos.sort(() => Math.random() - 0.5);
    const usedPos = pos.slice(0, Math.min(screwCount, pos.length));

    for (let s = 0; s < usedPos.length; s++) {
      const p = usedPos[s];
      const col = activeColors[(l + s + levelNum) % activeColors.length];
      screws.push({
        id: l * 100 + s,
        x: p.x, y: p.y, boardId: l,
        color: col.hex, colorId: col.id,
        removed: false, removing: false, removeProgress: 0, scale: 1,
        locked: (Math.random() < 0.1) // 10% chance locked
      });
    }
  }

  // Setup Top Boxes (Start with 2)
  const startColors = [activeColors[0], activeColors[1 % activeColors.length]];
  
  return {
    level: levelNum,
    boards,
    screws,
    capacity: boxCapacity,
    totalScrews: screws.length,
    removedCount: 0,
    startColors: startColors,
    allColors: activeColors,
    completed: false
  };
}

// ============================================================
// GAME LOGIC & UI SYNC
// ============================================================
function initLevel(levelNum) {
  gameState.level = levelNum;
  gameState.currentLevelData = generateLevel(levelNum);
  gameState.extraBoxesUnlocked = 0; // Reset ad boxes
  
  // Setup the 2 starting boxes
  const data = gameState.currentLevelData;
  gameState.activeBoxes = data.startColors.map((c, i) => ({
    id: i,
    colorId: c.id,
    colorHex: c.hex,
    border: c.border,
    capacity: data.capacity,
    filled: []
  }));

  updateTopUI();
  document.getElementById('level-badge').textContent = 'LEVEL ' + levelNum;
  document.getElementById('progress-star').textContent = '0%';
  
  hideScreens();
}

function updateTopUI() {
  const container = document.getElementById('tray-container');
  container.innerHTML = '';

  // 1. Render Active Boxes
  gameState.activeBoxes.forEach((box, index) => {
    const boxDiv = document.createElement('div');
    boxDiv.className = `tray-box ${box.colorId}`;
    
    // Add slots
    for (let i = 0; i < box.capacity; i++) {
      const slot = document.createElement('div');
      slot.className = 'tray-slot';
      if (i < box.filled.length) {
        slot.classList.add('filled');
        slot.style.backgroundColor = box.colorHex;
      }
      boxDiv.appendChild(slot);
    }
    container.appendChild(boxDiv);
  });

  // 2. Render AD Boxes if less than max limit
  const totalBoxes = gameState.activeBoxes.length;
  if (totalBoxes < gameState.maxBoxesLimit) {
    // Show ADD AD Box button
    const adBtn = document.createElement('div');
    adBtn.className = 'ad-box-btn';
    adBtn.innerHTML = '<span class="plus">+</span><span class="ad-tag">AD</span>';
    adBtn.onclick = showAdForNewBox;
    container.appendChild(adBtn);
  }
}

function showAdForNewBox() {
  if (gameState.activeBoxes.length >= gameState.maxBoxesLimit) return;
  
  // Show demo ad
  showDemoAd(() => {
    // Reward: Add a random new color box
    const availableColors = gameState.currentLevelData.allColors;
    const randomColor = availableColors[Math.floor(Math.random() * availableColors.length)];
    
    gameState.activeBoxes.push({
      id: Date.now(),
      colorId: randomColor.id,
      colorHex: randomColor.hex,
      border: randomColor.border,
      capacity: gameState.currentLevelData.capacity,
      filled: []
    });
    
    updateTopUI();
    showToast('New Box Unlocked!');
  });
}

// ============================================================
// CORE MECHANICS
// ============================================================
function handleScrewTap(screw) {
  const ls = gameState.currentLevelData;
  if (ls.completed || screw.removed || screw.removing) return;

  if (screw.locked) {
    showToast('🔒 Locked! Use Hammer.');
    return;
  }

  if (isCovered(ls, screw)) {
    showToast('🚫 Covered by another plate!');
    return;
  }

  // Find the matching box
  const box = gameState.activeBoxes.find(b => b.colorId === screw.colorId && b.filled.length < b.capacity);
  
  if (!box) {
    // If no box has space for this color, find ANY full box of this color to reset
    const fullBox = gameState.activeBoxes.find(b => b.colorId === screw.colorId && b.filled.length >= b.capacity);
    if (fullBox) {
      fullBox.filled = []; // Reset box
      updateTopUI();
      showToast('Box reset!');
    } else {
      showToast('No box for this color!');
      return;
    }
  }

  const targetBox = gameState.activeBoxes.find(b => b.colorId === screw.colorId && b.filled.length < b.capacity);
  if (!targetBox) return;

  // Animate screw removal
  screw.removing = true;
  screw.removeProgress = 0;

  setTimeout(() => {
    if (ls.completed) return;
    screw.removed = true;
    targetBox.filled.push(screw.id);
    ls.removedCount++;
    
    // Check if box is full now
    if (targetBox.filled.length >= targetBox.capacity) {
      // Auto-reset box after a short delay
      setTimeout(() => {
        targetBox.filled = [];
        updateTopUI();
        playSound('reset');
      }, 500);
    }

    updateTopUI();
    updateProgress();
    checkBoardRemoval(ls);

    if (ls.removedCount >= ls.totalScrews) {
      winLevel(ls);
    }
  }, 300);
}

function updateProgress() {
  const ls = gameState.currentLevelData;
  const percent = Math.floor((ls.removedCount / ls.totalScrews) * 100);
  document.getElementById('progress-star').textContent = percent + '%';
}

function isCovered(ls, screw) {
  const board = ls.boards.find(b => b.id === screw.boardId);
  for (const other of ls.boards) {
    if (other.id !== board.id && !other.removed && other.layer > board.layer) {
      // Simple bounding box check
      if (screw.x > other.x && screw.x < other.x + other.w &&
          screw.y > other.y && screw.y < other.y + other.h) {
        return true;
      }
    }
  }
  return false;
}

function checkBoardRemoval(ls) {
  for (const board of ls.boards) {
    if (board.removed) continue;
    const boardScrews = ls.screws.filter(s => s.boardId === board.id);
    const allRemoved = boardScrews.every(s => s.removed || s.removing);
    if (allRemoved && boardScrews.length > 0) {
      board.removed = true;
      board.fallVel = 50;
      playSound('fall');
    }
  }
}

function winLevel(ls) {
  if (ls.completed) return;
  ls.completed = true;
  gameState.coins += 50;
  document.getElementById('victory-coins').textContent = '+50';
  document.getElementById('victory-screen').classList.remove('hidden');
}

// ============================================================
// DRAWING (2D CARTOON STYLE)
// ============================================================
function drawLeaf(x, y, w, h, color, angle) {
  ctx.save();
  ctx.translate(x + w/2, y + h/2);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.quadraticCurveTo(w/2, 0, 0, h/2);
  ctx.quadraticCurveTo(-w/2, 0, 0, -h/2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; // White outline style
  ctx.stroke();
  
  // Inner detail line
  ctx.beginPath();
  ctx.moveTo(0, -h/2 + 10);
  ctx.lineTo(0, h/2 - 10);
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawPetal(x, y, w, h, color) {
  ctx.save();
  ctx.translate(x + w/2, y + h/2);
  ctx.beginPath();
  ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.stroke();
  ctx.restore();
}

function drawScrew(x, y, color, scale, isLocked) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  // Shadow
  ctx.beginPath(); ctx.arc(2, 3, 12, 0, Math.PI*2); ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill();

  // Base
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.stroke();

  // Cross
  ctx.beginPath();
  ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
  ctx.moveTo(0, -6); ctx.lineTo(0, 6);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Lock icon
  if (isLocked) {
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔒', 0, 0);
  }

  ctx.restore();
}

function drawHole(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI*2);
  ctx.fillStyle = '#D3C5A3'; // Darker cream for hole
  ctx.fill();
  ctx.strokeStyle = '#B8A880';
  ctx.lineWidth = 2;
  ctx.stroke();
}

let lastTime = 0;
function render(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (gameState.paused) {
    requestAnimationFrame(render);
    return;
  }

  ctx.clearRect(0, 0, logicalWidth, logicalHeight);

  const ls = gameState.currentLevelData;
  if (ls) {
    // Update physics
    for (const board of ls.boards) {
      if (board.removed) {
        board.fallVel += CONFIG.GRAVITY * dt;
        board.fallY += board.fallVel * dt;
        board.rotation += 0.05 * dt * 60;
      } else {
        // Swing if 1 screw left
        const activeScrews = ls.screws.filter(s => s.boardId === board.id && !s.removed && !s.removing);
        if (activeScrews.length === 1) {
          board.swingTime = (board.swingTime || 0) + dt;
          board.swingAngle = Math.sin(board.swingTime * 5) * 0.1;
        } else {
          board.swingAngle = 0;
        }
      }
    }

    for (const s of ls.screws) {
      if (s.removing) {
        s.removeProgress += dt * 4;
        s.scale = Math.max(0, 1 - s.removeProgress);
        if (s.removeProgress >= 1) s.removing = false;
      }
    }

    // Draw Boards
    const sortedBoards = [...ls.boards].sort((a,b) => a.layer - b.layer);
    for (const b of sortedBoards) {
      if (b.removed && b.fallY > 800) continue;
      
      const cx = b.x + b.w/2;
      const cy = b.y + b.h/2 + (b.fallY || 0);
      
      ctx.save();
      ctx.translate(cx, cy);
      if (b.swingAngle) ctx.rotate(b.swingAngle);
      if (b.removed) ctx.rotate(b.rotation);
      ctx.translate(-cx, -cy);

      if (b.shape === 'leaf') drawLeaf(b.x, b.y, b.w, b.h, b.color, 0);
      else if (b.shape === 'petal') drawPetal(b.x, b.y, b.w, b.h, b.color);
      else {
        // Hexagon fallback
        ctx.beginPath();
        for(let i=0; i<6; i++){
          const a = i/6*Math.PI*2;
          const px = cx + Math.cos(a)*b.w/2;
          const py = cy + Math.sin(a)*b.h/2;
          if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
      ctx.restore();
    }

    // Draw Holes
    for (const s of ls.screws) {
      if (s.removed) {
        const b = ls.boards.find(b => b.id === s.boardId);
        if (b && b.removed && b.fallY > 600) continue;
        let hx = s.x, hy = s.y;
        if (b && b.removed) hy += b.fallY;
        drawHole(hx, hy);
      }
    }

    // Draw Screws
    for (const s of ls.screws) {
      if (s.removed || s.removing) continue;
      const b = ls.boards.find(b => b.id === s.boardId);
      if (b && b.removed && b.fallY > 600) continue;
      
      if (isCovered(ls, s)) continue; // Hidden under another plate

      let sx = s.x, sy = s.y;
      if (b && b.removed) sy += b.fallY;
      
      drawScrew(sx, sy, s.color, s.scale || 1, s.locked);
    }
  }

  requestAnimationFrame(render);
}

// ============================================================
// INTERACTION
// ============================================================
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameState.paused) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches[0].clientX - rect.left) * (logicalWidth / rect.width);
  const y = (e.touches[0].clientY - rect.top) * (logicalHeight / rect.height);
  
  const ls = gameState.currentLevelData;
  if (!ls) return;

  // Find topmost screw
  const sortedScrews = [...ls.screws].sort((a, b) => {
    const bA = ls.boards.find(b => b.id === a.boardId);
    const bB = ls.boards.find(b => b.id === b.boardId);
    return (bB?.layer || 0) - (bA?.layer || 0);
  });

  for (const s of sortedScrews) {
    if (s.removed || s.removing || isCovered(ls, s)) continue;
    const dist = Math.hypot(x - s.x, y - s.y);
    if (dist < CONFIG.SCREW_RADIUS * 2.5) {
      handleScrewTap(s);
      break;
    }
  }
}, { passive: false });

// Prevent scrolling
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

// ============================================================
// BOOSTERS
// ============================================================
document.getElementById('btn-drill').addEventListener('click', () => {
  if (gameState.drill <= 0) return showToast('No drills left!');
  const ls = gameState.currentLevelData;
  const available = ls.screws.filter(s => !s.removed && !s.removing && !isCovered(ls, s));
  if (available.length === 0) return showToast('No available screws!');
  
  // Destroy one random available screw
  const target = available[Math.floor(Math.random() * available.length)];
  target.removed = true;
  ls.removedCount++;
  gameState.drill--;
  document.getElementById('count-drill').textContent = gameState.drill;
  updateProgress();
  checkBoardRemoval(ls);
  if (ls.removedCount >= ls.totalScrews) winLevel(ls);
  showToast('Drilled!');
});

document.getElementById('btn-hammer').addEventListener('click', () => {
  if (gameState.hammer <= 0) return showToast('No hammers left!');
  const ls = gameState.currentLevelData;
  const locked = ls.screws.find(s => s.locked && !s.removed);
  if (!locked) return showToast('No locked screws!');
  
  locked.locked = false;
  gameState.hammer--;
  document.getElementById('count-hammer').textContent = gameState.hammer;
  showToast('Unlocked!');
});

document.getElementById('btn-brush').addEventListener('click', () => {
  if (gameState.brush <= 0) return showToast('No brushes left!');
  // Demo: Brush removes one random top-layer screw color box
  gameState.brush--;
  document.getElementById('count-brush').textContent = gameState.brush;
  
  // Randomly clear one box
  if (gameState.activeBoxes.length > 0) {
    const box = gameState.activeBoxes[0];
    box.filled = [];
    updateTopUI();
    showToast('Box Cleaned!');
  }
});

// ============================================================
// AD SIMULATION
// ============================================================
function showDemoAd(callback) {
  const adScreen = document.getElementById('ad-screen');
  const timerEl = document.getElementById('ad-timer');
  const closeBtn = document.getElementById('ad-close-btn');
  
  adScreen.classList.remove('hidden');
  closeBtn.classList.add('hidden');
  
  let timeLeft = 3;
  timerEl.textContent = timeLeft;
  
  const interval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(interval);
      closeBtn.classList.remove('hidden');
    }
  }, 1000);

  closeBtn.onclick = () => {
    adScreen.classList.add('hidden');
    if (callback) callback();
  };
}

document.getElementById('ad-coins-btn').addEventListener('click', () => {
  showDemoAd(() => {
    gameState.coins += 100;
    showToast('+100 Coins!');
  });
});

// ============================================================
// UTILS
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function hideScreens() {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
}

function playSound(type) {
  // Simple beep using Web Audio API
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain);
    gain.connect(actx.destination);
    if (type === 'reset') osc.frequency.value = 600;
    else if (type === 'fall') osc.frequency.value = 300;
    else osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.1, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.2);
    osc.start();
    osc.stop(actx.currentTime + 0.2);
  } catch(e){}
}

// INIT
// ============================================================
document.getElementById('play-btn').addEventListener('click', () => {
  hideScreens();
  initLevel(gameState.level);
});

document.getElementById('next-level-btn').addEventListener('click', () => {
  hideScreens();
  gameState.level++;
  initLevel(gameState.level);
});

requestAnimationFrame(render);
initLevel(1); // Load level 1 but keep home screen visible

})();
